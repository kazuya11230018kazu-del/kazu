<!DOCTYPE html>																									
<html lang="ja">																									
<head>																									
<meta charset="UTF-8">																									
<title>キッチン・注文管理ダッシュボード</title>																									
<style>																									
body { font-family: sans-serif; margin: 20px; background: #2f3640; color: #f5f6fa; }																									
h1 { font-size: 1.4rem; border-bottom: 2px solid #718093; padding-bottom: 10px; display: flex; justify-content: space-between; }																									
.order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }																									
.order-card { background: #f5f6fa; color: #333; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }																									
.order-card h3 { margin-top: 0; border-bottom: 1px solid #ddd; padding-bottom: 5px; display: flex; justify-content: space-between; }																									
.status-調理待ち { background: #ff4757; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }																									
.status-調理中 { background: #ffa502; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }																									
.status-提供済み { background: #2ed573; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }																									
ul { padding-left: 20px; margin: 10px 0; }																									
.btn-group { display: flex; gap: 5px; margin-top: 10px; }																									
.btn-group button { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }																									
.btn-cooking { background: #ffa502; color: white; }																									
.btn-done { background: #2ed573; color: white; }																									
</style>																									
</head>																									
<body>																									
<h1>																									
<span>🍳 キッチン注文モニター</span>																									
<span style="font-size: 0.9rem; font-weight: normal; color: #dcdde1;">自動更新中...</span>																									
</h1>																									
																									
<div class="order-grid" id="orderContainer">																									
<p>注文データを読み込み中...</p>																									
</div>																									
																									
<script>																									
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz1UPfYqM3ww8ZImbqpOCM73qXw5hrrzdJG75chYd5P8V-9Z6mQdrbDo0GyxEtq4UJbNw/exec";																									
																									
async function fetchOrders() {																									
try {																									
const response = await fetch(`${GAS_API_URL}?action=getOrders`);																									
const result = await response.json();																									
if (result.status === "success") {																									
renderOrders(result.data);																									
}																									
} catch (e) {																									
console.error("ポーリングエラー:", e);																									
}																									
}																									
																									
function renderOrders(rows) {																									
const container = document.getElementById("orderContainer");																									
if (!rows || rows.length === 0) {																									
container.innerHTML = "<p>現在、新しい注文はありません。</p>";																									
return;																									
}																									
																									
let ordersMap = {};																									
rows.forEach(row => {																									
const id = row.注文ID;																									
if (!id) return;																									
if (!ordersMap[id]) {																									
ordersMap[id] = {																									
orderId: id,																									
status: row.調理ステータス || "調理待ち",																									
time: row.注文日時 ? new Date(row.注文日時).toLocaleTimeString() : "",																									
items: []																									
};																									
}																									
ordersMap[id].items.push({ name: row.商品名, qty: row.数量 });																									
});																									
																									
const orderKeys = Object.keys(ordersMap);																									
if (orderKeys.length === 0) {																									
container.innerHTML = "<p>現在、有効な注文はありません。</p>";																									
return;																									
}																									
																									
container.innerHTML = orderKeys.map(id => {																									
const order = ordersMap[id];																									
return `																									
<div class="order-card">																									
<h3>																									
<span>${order.orderId}</span>																									
<span class="status-${order.status}">${order.status}</span>																									
</h3>																									
<p style="font-size: 0.85rem; color: #666; margin: 5px 0;">時間: ${order.time}</p>																									
<ul>																									
${order.items.map(i => `<li><b>${i.name}</b> × ${i.qty}</li>`).join('')}																									
</ul>																									
<div class="btn-group">																									
<button class="btn-cooking" onclick="updateStatus('${order.orderId}', '調理中')">調理中</button>																									
<button class="btn-done" onclick="updateStatus('${order.orderId}', '提供済み')">提供済み</button>																									
</div>																									
</div>																									
`;																									
}).join('');																									
}																									
																									
async function updateStatus(orderId, status) {																									
try {																									
const response = await fetch(GAS_API_URL, {																									
method: "POST",																									
body: JSON.stringify({ action: "updateStatus", payload: { orderId: orderId, status: status } })																									
});																									
const result = await response.json();																									
if (result.status === "success") {																									
fetchOrders();																									
} else {																									
alert("更新失敗: " + result.message);																									
}																									
} catch (e) {																									
console.error(e);																									
alert("通信エラーが発生しました。");																									
}																									
}																									
																									
setInterval(fetchOrders, 4000);																									
window.onload = fetchOrders;																									
</script>																									
</body>																									
</html>
