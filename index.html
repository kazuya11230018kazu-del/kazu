<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接続テスト</title>
    <style>
        body { font-family: sans-serif; background: #2b5d34; color: white; text-align: center; padding: 40px; }
        .box { background: white; color: #333; padding: 20px; border-radius: 8px; max-width: 400px; margin: 0 auto; }
        button { background: #d32f2f; color: white; border: none; padding: 15px; font-size: 16px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="box">
        <h2>スプレッドシート接続テスト</h2>
        <p>下のボタンを押すと、スプレッドシートからメニューを取得して下に表示します。</p>
        <button onclick="testConnect()">スプレッドシートと通信する</button>
        <div id="result" style="margin-top: 20px; text-align: left; font-size: 14px; color: #000;"></div>
    </div>

    <script>
        // ▼ ここに最新のGASウェブアプリのURLを貼り付けてください
        const GAS_URL = "ここにGASのウェブアプリURLを貼り付け";

        async function testConnect() {
            const resDiv = document.getElementById('result');
            resDiv.innerHTML = "通信中...";
            try {
                let response = await fetch(GAS_URL + "?action=menu");
                let text = await response.text();
                resDiv.innerHTML = "<b>通信成功！データ受信：</b><br>" + text;
            } catch (error) {
                resDiv.innerHTML = "<b style='color:red;'>通信エラー：</b><br>" + error.message;
            }
        }
    </script>
</body>
</html>
