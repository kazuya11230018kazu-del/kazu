<script>																									
																									
const API='https://script.google.com/macros/s/AKfycbxzxAT7w9VscVWSYeCGs0b0BSzw_FSV58ijndShy6Jrn_27p0Abw4O3bru6KK_vCCK2iQ/exec';																									
																									
let menu=[];																									
let cart={};																									
let currentCategory='all';																									
																									
let tableNo=																									
localStorage.getItem('saizeriya_table_no') ||																									
1';																									
																									
																									
window.onload=function(){																									
																									
document.getElementById('tableDisplay').textContent=																									
tableNo;																									
																									
if(!localStorage.getItem('saizeriya_table_no')){																									
openTable();																									
}																									
																									
renderCart();																									
																									
loadMenu();																									
																									
};																									
																									
																									
function api(action,data){																									
																									
return new Promise(function(resolve,reject){																									
																									
const cb=																									
jsonp_' +																									
Date.now() +																									
_' +																									
Math.floor(Math.random()*99999);																									
																									
const script=																									
document.createElement('script');																									
																									
let finished=false;																									
																									
const timer=																									
setTimeout(function(){																									
																									
if(finished){																									
return;																									
}																									
																									
finished=true;																									
																									
cleanup();																									
																									
reject(																									
new Error('通信タイムアウト')																									
);																									
																									
},15000);																									
																									
																									
function cleanup(){																									
																									
clearTimeout(timer);																									
																									
try{																									
delete window[cb];																									
}catch(e){}																									
																									
if(script.parentNode){																									
script.parentNode.removeChild(script);																									
}																									
																									
}																									
																									
																									
window[cb]=function(result){																									
																									
if(finished){																									
return;																									
}																									
																									
finished=true;																									
																									
cleanup();																									
																									
resolve(result);																									
																									
};																									
																									
																									
script.onerror=function(){																									
																									
if(finished){																									
return;																									
}																									
																									
finished=true;																									
																									
cleanup();																									
																									
reject(																									
new Error('JSONP通信エラー')																									
);																									
																									
};																									
																									
																									
const params=																									
new URLSearchParams();																									
																									
params.set(																									
action',																									
action																									
);																									
																									
params.set(																									
callback',																									
cb																									
);																									
																									
params.set(																									
data',																									
JSON.stringify(data||{})																									
);																									
																									
params.set(																									
_',																									
String(Date.now())																									
);																									
																									
																									
script.src=																									
API +																									
?' +																									
params.toString();																									
																									
																									
document.body.appendChild(script);																									
																									
});																									
																									
}																									
																									
																									
function setStatus(ok){																									
																									
const el=																									
document.getElementById('status');																									
																									
if(ok){																									
																									
el.textContent='接続中';																									
el.style.background='#10b981';																									
																									
}else{																									
																									
el.textContent='通信エラー';																									
el.style.background='#dc2626';																									
																									
}																									
																									
}																									
																									
																									
function loadMenu(){																									
																									
api('getMenu',{})																									
																									
.then(function(res){																									
																									
if(																									
!res ||																									
res.status!=='success'																									
){																									
																									
throw new Error(																									
res && res.message																									
? res.message																									
: 'メニュー取得失敗'																									
);																									
																									
}																									
																									
setStatus(true);																									
																									
menu=res.data||[];																									
																									
renderCategories();																									
renderMenu();																									
																									
})																									
																									
.catch(function(err){																									
																									
console.log(err);																									
																									
setStatus(false);																									
																									
document.getElementById('menuList').innerHTML=																									
<div class=error>メニュー取得エラー<br>'+safe(err.message)+'</div>';																									
																									
});																									
																									
}																									
																									
																									
function renderCategories(){																									
																									
const list=['all'];																									
																									
menu.forEach(function(item){																									
																									
if(																									
list.indexOf(item.category)===-1																									
){																									
list.push(item.category);																									
}																									
																									
});																									
																									
const box=																									
document.getElementById('catbar');																									
																									
box.innerHTML='';																									
																									
list.forEach(function(cat){																									
																									
const btn=																									
document.createElement('button');																									
																									
btn.textContent=																									
cat==='all'																									
?'すべて'																									
:cat;																									
																									
if(cat===currentCategory){																									
btn.className='active';																									
}																									
																									
btn.onclick=function(){																									
																									
currentCategory=cat;																									
																									
renderCategories();																									
renderMenu();																									
																									
};																									
																									
box.appendChild(btn);																									
																									
});																									
																									
}																									
																									
																									
function renderMenu(){																									
																									
const box=																									
document.getElementById('menuList');																									
																									
const list=																									
currentCategory==='all'																									
?menu																									
:menu.filter(function(item){																									
return item.category===currentCategory;																									
});																									
																									
box.innerHTML='';																									
																									
if(list.length===0){																									
																									
box.innerHTML=																									
<div class=loading>メニューがありません</div>';																									
																									
return;																									
																									
}																									
																									
list.forEach(function(item){																									
																									
const qty=																									
cart[item.id]																									
?cart[item.id].quantity																									
:0;																									
																									
const card=																									
document.createElement('div');																									
																									
card.className='card';																									
																									
card.innerHTML=																									
<div class=row>' +																									
<div>' +																									
<div class=small>' +																									
safe(item.category) +																									
</div>' +																									
<div class=name>' +																									
safe(item.name) +																									
</div>' +																									
<div class=price>¥' +																									
money(item.price) +																									
</div>' +																									
</div>' +																									
<div class=qty>' +																									
<button class=minus>-</button>' +																									
<b>' + qty + '</b>' +																									
<button class=plus>+</button>' +																									
</div>' +																									
</div>';																									
																									
const buttons=																									
card.querySelectorAll('button');																									
																									
buttons[0].onclick=function(){																									
changeQty(item.id,-1);																									
};																									
																									
buttons[1].onclick=function(){																									
changeQty(item.id,1);																									
};																									
																									
box.appendChild(card);																									
																									
});																									
																									
}																									
																									
																									
function changeQty(id,delta){																									
																									
const item=																									
menu.find(function(x){																									
return String(x.id)===String(id);																									
});																									
																									
if(!item){																									
return;																									
}																									
																									
if(!cart[id]){																									
																									
if(delta<0){																									
return;																									
}																									
																									
cart[id]={																									
id:item.id,																									
name:item.name,																									
price:Number(item.price),																									
quantity:0																									
};																									
																									
}																									
																									
cart[id].quantity+=delta;																									
																									
if(cart[id].quantity<=0){																									
delete cart[id];																									
}																									
																									
renderMenu();																									
renderCart();																									
																									
}																									
																									
																									
function renderCart(){																									
																									
const box=																									
document.getElementById('cartList');																									
																									
const items=																									
Object.values(cart);																									
																									
let total=0;																									
																									
box.innerHTML='';																									
																									
if(items.length===0){																									
																									
box.innerHTML=																									
<div class=loading>注文かごは空です</div>';																									
																									
}																									
																									
items.forEach(function(item){																									
																									
const subtotal=																									
Number(item.price) *																									
Number(item.quantity);																									
																									
total+=subtotal;																									
																									
const card=																									
document.createElement('div');																									
																									
card.className='card';																									
																									
card.innerHTML=																									
<div class=row>' +																									
<div>' +																									
<div class=name>' +																									
safe(item.name) +																									
</div>' +																									
<div class=small>¥' +																									
money(item.price) +																									
 × ' +																									
item.quantity +																									
</div>' +																									
</div>' +																									
<b>¥' +
