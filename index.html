<!DOCTYPE html>																									
<html lang="ja">																									
<head>																									
<meta charset="UTF-8">																									
<meta name="viewport" content="width=device-width, initial-scale=1.0">																									
<title>モバイルオーダー</title>																									
<!-- Tailwind CSS -->																									
<script src="https://cdn.tailwindcss.com"></script>																									
<!-- QR Code Generator -->																									
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>																									
</head>																									
<body class="bg-gray-50 text-gray-800 pb-28">																									
																									
<!-- ヘッダー -->																									
<header class="bg-indigo-600 text-white p-4 sticky top-0 z-10 shadow-md flex justify-between items-center">																									
<div>																									
<h1 class="text-lg font-bold">モバイルオーダー</h1>																									
<p class="text-xs text-indigo-200">テーブル: <span id="display-table" class="font-bold">未設定</span></p>																									
</div>																									
<div class="flex items-center space-x-2">																									
<button onclick="openStatusModal()" class="text-xs bg-indigo-500 px-3 py-1.5 rounded-lg font-bold hover:bg-indigo-400 transition shadow">																									
注文状況・会計																									
</button>																									
<div class="text-xs bg-green-500 px-2 py-1 rounded text-white">接続完了</div>																									
</div>																									
</header>																									
																									
<!-- メインコンテンツ -->																									
<main class="max-w-md mx-auto p-4">																									
<!-- テーブル番号選択モーダル -->																									
<div id="table-modal" class="fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4">																									
<div class="bg-white w-full max-w-sm rounded-2xl p-6 text-center space-y-4 shadow-xl">																									
<h2 class="text-xl font-bold text-gray-800">テーブル番号をお選びください</h2>																									
<p class="text-sm text-gray-500">お座りのテーブル番号を選択し、決定ボタンを押してください</p>																									
																									
<!-- 1〜5番を選択するボタン群 -->																									
<div class="grid grid-cols-1 gap-2.5 py-1">																									
<button type="button" onclick="selectTempTable('1')" id="t-btn-1" class="table-select-btn w-full bg-gray-50 hover:bg-indigo-50 text-gray-700 border border-gray-200 font-bold py-3.5 rounded-xl text-lg transition shadow-sm">1番テーブル</button>																									
<button type="button" onclick="selectTempTable('2')" id="t-btn-2" class="table-select-btn w-full bg-gray-50 hover:bg-indigo-50 text-gray-700 border border-gray-200 font-bold py-3.5 rounded-xl text-lg transition shadow-sm">2番テーブル</button>																									
<button type="button" onclick="selectTempTable('3')" id="t-btn-3" class="table-select-btn w-full bg-gray-50 hover:bg-indigo-50 text-gray-700 border border-gray-200 font-bold py-3.5 rounded-xl text-lg transition shadow-sm">3番テーブル</button>																									
<button type="button" onclick="selectTempTable('4')" id="t-btn-4" class="table-select-btn w-full bg-gray-50 hover:bg-indigo-50 text-gray-700 border border-gray-200 font-bold py-3.5 rounded-xl text-lg transition shadow-sm">4番テーブル</button>																									
<button type="button" onclick="selectTempTable('5')" id="t-btn-5" class="table-select-btn w-full bg-gray-50 hover:bg-indigo-50 text-gray-700 border border-gray-200 font-bold py-3.5 rounded-xl text-lg transition shadow-sm">5番テーブル</button>																									
</div>																									
																									
<button type="button" onclick="confirmTable()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl text-lg transition shadow-md mt-2">																									
決定する																									
</button>																									
</div>																									
</div>																									
																									
<div id="loading" class="text-center py-10 hidden">																									
<p class="text-gray-500">メニューを読み込んでいます...</p>																									
</div>																									
																									
<div id="menu-container" class="space-y-4 hidden"></div>																									
</main>																									
																									
<!-- 注文カート -->																									
<div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-lg hidden max-w-md mx-auto flex justify-between items-center z-20">																									
<div>																									
<p class="text-sm text-gray-500">合計点数: <span id="cart-count" class="font-bold text-gray-800">0</span>点</p>																									
<p class="text-lg font-bold text-indigo-600">¥<span id="cart-total">0</span></p>																									
</div>																									
<button onclick="openCartModal()" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-bold shadow hover:bg-indigo-700 transition">																									
カートを確認する																									
</button>																									
</div>																									
																									
<!-- カート確認モーダル -->																									
<div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">																									
<div class="bg-white w-full max-w-lg rounded-2xl max-h-[90vh] flex flex-col overflow-hidden p-4 space-y-4">																									
<div class="p-4 border-b flex justify-between items-center">																									
<h2 class="text-lg font-bold">注文内容の確認</h2>																									
<button onclick="closeCartModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>																									
</div>																									
<div id="cart-items-list" class="overflow-y-auto flex-grow space-y-3 max-h-60"></div>																									
<div class="border-t pt-2">																									
<div class="flex justify-between mb-4 text-lg font-bold">																									
<span>合計金額（税込）</span>																									
<span class="text-indigo-600">¥<span id="modal-total">0</span></span>																									
</div>																									
<button onclick="submitOrder()" id="submit-btn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow">																									
注文を確定する																									
</button>																									
</div>																									
</div>																									
</div>																									
																									
<!-- 注文状況・お会計モーダル -->																									
<div id="status-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">																									
<div class="bg-white w-full max-w-md rounded-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">																									
<div class="flex justify-between items-center border-b pb-3">																									
<h2 class="text-lg font-bold">注文状況・お会計</h2>																									
<button onclick="closeStatusModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>																									
</div>																									
<div id="status-content" class="space-y-3 text-sm">																									
<p class="text-gray-500 text-center py-4">現在、保存されている注文はありません。</p>																									
</div>																									
<div id="checkout-area" class="pt-2 hidden">																									
<button onclick="requestCheckout()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 transition shadow">																									
お会計する（領収書発行）																									
</button>																									
</div>																									
</div>																									
</div>																									
																									
<!-- 注文完了・領収書モーダル -->																									
<div id="receipt-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">																									
<div class="bg-white w-full max-w-md rounded-2xl p-6 text-center space-y-4 max-h-[90vh] overflow-y-auto">																									
<div class="text-green-600 text-5xl font-bold">✓</div>																									
<h2 class="text-xl font-bold">お会計が完了しました</h2>																									
<p class="text-sm text-gray-500">テーブル: <span id="receipt-table-no" class="font-bold text-gray-700"></span>番</p>																									
<div class="border border-dashed border-gray-300 p-4 rounded-xl text-left text-sm space-y-2 bg-gray-50">																									
<div class="text-center font-bold border-b pb-2">デジタル領収書</div>																									
<div id="receipt-items-summary" class="py-2 space-y-1 border-b"></div>																									
<div class="flex justify-between font-bold text-base pt-1">																									
<span>合計金額</span>																									
<span id="receipt-total">¥0</span>																									
</div>																									
</div>																									
<div class="flex flex-col items-center justify-center space-y-1 pt-2">																									
<div id="qrcode" class="p-2 bg-white border rounded shadow-sm inline-block"></div>																									
<span class="text-xs text-gray-400">お会計確認用QRコード</span>																									
</div>																									
<button onclick="location.reload()" class="w-full bg-gray-200 text-gray-700 py-3 rounded-xl font-bold hover:bg-gray-300 transition">																									
新しい注文をする																									
</button>																									
</div>																									
</div>																									
																									
<script>																									
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz1UPfYqM3ww8ZImbqpOCM73qXw5hrrzdJG75chYd5P8V-9Z6mQdrbDo0GyxEtq4UJbNw/exec";																									
																									
let menuData = [];																									
let cart = {};																									
let currentTableNo = "";																									
let tempSelectedTable = "";																									
																									
window.onload = function() {																									
document.getElementById('table-modal').classList.remove('hidden');																									
document.getElementById('loading').classList.add('hidden');																									
fetchMenu();																									
};																									
																									
function selectTempTable(tableNo) {																									
tempSelectedTable = String(tableNo);																									
document.querySelectorAll('.table-select-btn').forEach(btn => {																									
btn.className = "table-select-btn w-full bg-gray-50 hover:bg-indigo-50 text-gray-700 border border-gray-200 font-bold py-3.5 rounded-xl text-lg transition shadow-sm";																									
});																									
const selectedBtn = document.getElementById('t-btn-' + tableNo);																									
if (selectedBtn) {																									
selectedBtn.className = "table-select-btn w-full bg-indigo-600 text-white border border-indigo-600 font-bold py-3.5 rounded-xl text-lg transition shadow-md";																									
}																									
}																									
																									
function confirmTable() {																									
if (!tempSelectedTable) {																									
alert("テーブル番号を選択してください。");																									
return;																									
}																									
currentTableNo = tempSelectedTable;																									
document.getElementById('display-table').textContent = currentTableNo + "番";																									
document.getElementById('table-modal').classList.add('hidden');																									
}																									
																									
function fetchMenu() {																									
fetch(GAS_API_URL + "?action=getMenu")																									
.then(response => response.json())																									
.then(result => {																									
if (result && result.status === "success") {																									
menuData = result.data || [];																									
renderMenu();																									
} else {																									
alert("メニューの取得に失敗しました: " + (result ? result.message : "不明なエラー"));																									
}																									
})																									
.catch(error => { console.error(error); });																									
}																									
																									
function renderMenu() {																									
const container = document.getElementById('menu-container');																									
container.classList.remove('hidden');																									
container.innerHTML = '';																									
																									
menuData.forEach((item) => {																									
const card = document.createElement('div');																									
card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center";																									
card.innerHTML = `																									
<div>																									
<h3 class="font-bold text-gray-800">${item.name}</h3>																									
<p class="text-indigo-600 font-bold mt-1">¥${Number(item.price).toLocaleString()}</p>																									
<p class="text-xs text-gray-400 mt-1">${item.category || ''}</p>																									
</div>																									
<div class="flex items-center space-x-3">																									
<button type="button" onclick="changeQuantity('${item.code}', -1)" class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 font-bold flex items-center justify-center">-</button>																									
<span id="qty-${item.code}" class="font-bold w-4 text-center">0</span>																									
<button type="button" onclick="changeQuantity('${item.code}', 1)" class="w-8 h-8 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center">+</button>																									
</div>																									
`;																									
container.appendChild(card);																									
});																									
}																									
																									
function changeQuantity(code, delta) {																									
const item = menuData.find(m => m.code === code);																									
if (!item) return;																									
																									
if (!cart[code]) {																									
cart[code] = { ...item, quantity: 0 };																									
}																									
																									
cart[code].quantity += delta;																									
if (cart[code].quantity < 0) cart[code].quantity = 0;																									
																									
const qtyElem = document.getElementById(`qty-${code}`);																									
if (qtyElem) qtyElem.textContent = cart[code].quantity;																									
if (cart[code].quantity === 0) delete cart[code];																									
																									
updateCartSummary();																									
}																									
																									
function updateCartSummary() {																									
let totalCount = 0;																									
let totalPrice = 0;																									
																									
Object.values(cart).forEach(item => {																									
totalCount += item.quantity;																									
totalPrice += Number(item.price) * item.quantity;																									
});																									
																									
document.getElementById('cart-count').textContent = totalCount;																									
document.getElementById('cart-total').textContent = totalPrice.toLocaleString();																									
																									
const cartBar = document.getElementById('cart-bar');																									
if (totalCount > 0) {																									
cartBar.classList.remove('hidden');																									
} else {																									
cartBar.classList.add('hidden');																									
}																									
}																									
																									
function openCartModal() {																									
if (!currentTableNo) {																									
alert("テーブル番号が選択されていません。");																									
return;																									
}																									
																									
const listContainer = document.getElementById('cart-items-list');																									
listContainer.innerHTML = '';																									
let totalPrice = 0;																									
																									
Object.values(cart).forEach(item => {																									
const subtotal = Number(item.price) * item.quantity;																									
totalPrice += subtotal;																									
																									
const row = document.createElement('div');																									
row.className = "flex justify-between items-center border-b pb-2";																									
row.innerHTML = `																									
<div>																									
<div class="font-bold">${item.name}</div>																									
<div class="text-xs text-gray-500">¥${Number(item.price).toLocaleString()} × ${item.quantity}</div>																									
</div>																									
<div class="font-bold">¥${subtotal.toLocaleString()}</div>																									
`;																									
listContainer.appendChild(row);																									
});																									
																									
document.getElementById('modal-total').textContent = totalPrice.toLocaleString();																									
document.getElementById('cart-modal').classList.remove('hidden');																									
}																									
																									
function closeCartModal() {																									
document.getElementById('cart-modal').classList.add('hidden');																									
}																									
																									
function submitOrder() {																									
const itemsArray = Object.values(cart).filter(item => item.quantity > 0);																									
if (itemsArray.length === 0) return;																									
																									
const submitBtn = document.getElementById('submit-btn');																									
submitBtn.disabled = true;																									
submitBtn.textContent = "送信中...";																									
																									
const payload = {																									
action: "submitOrder",																									
payload: {																									
tableNo: currentTableNo,																									
items: itemsArray																									
}																									
};																									
																									
fetch(GAS_API_URL, {																									
method: "POST",																									
headers: { "Content-Type": "text/plain;charset=utf-8" },																									
body: JSON.stringify(payload)																									
})																									
.then(response => response.json())																									
.then(result => {																									
submitBtn.disabled = false;																									
submitBtn.textContent = "注文を確定する";																									
closeCartModal();																									
																									
if (result && result.status === "success") {																									
alert("注文が完了しました！キッチンへ送信されました。");																									
cart = {};																									
updateCartSummary();																									
} else {																									
alert("送信失敗: " + (result ? result.message : "不明なエラー"));																									
}																									
})																									
.catch(error => {																									
submitBtn.disabled = false;																									
submitBtn.textContent = "注文を確定する";																									
closeCartModal();																									
alert("通信エラーが発生しました。");																									
});																									
}																									
																									
function openStatusModal() {																									
if (!currentTableNo) {																									
alert("テーブル番号が選択されていません。");																									
return;																									
}																									
																									
const modal = document.getElementById('status-modal');																									
const content = document.getElementById('status-content');																									
const checkoutArea = document.getElementById('checkout-area');																									
																									
modal.classList.remove('hidden');																									
content.innerHTML = '<p class="text-gray-500 text-center py-4">注文状況を確認中...</p>';																									
																									
// 選択中のテーブル番号に一致する注文をスプレッドシートから取得																									
fetch(GAS_API_URL + "?action=getOrderByTable&tableNo=" + encodeURIComponent(currentTableNo))																									
.then(res => res.json())																									
.then(res => {																									
if (res && res.status === "success" && res.items && res.items.length > 0) {																									
let html = '<div class="space-y-3 max-h-60 overflow-y-auto">';																									
																									
res.items.forEach(i => {																									
let badgeColor = "bg-yellow-100 text-yellow-800";																									
if (i.cookStatus === "調理中") badgeColor = "bg-blue-100 text-blue-800";																									
if (i.cookStatus === "提供済み" || i.cookStatus === "完了") badgeColor = "bg-green-100 text-green-800";																									
if (i.cookStatus === "会計済み") badgeColor = "bg-gray-100 text-gray-800";																									
																									
html += `																									
<div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border">																									
<div>																									
<div class="font-bold">${i.name} × ${i.quantity}</div>																									
<div class="text-xs text-gray-500">¥${Number(i.price).toLocaleString()} (テーブル: ${i.tableNo}番)</div>																									
</div>																									
<span class="text-xs px-2.5 py-1 rounded-full font-bold ${badgeColor}">${i.cookStatus}</span>																									
</div>																									
`;																									
});																									
html += '</div>';																									
content.innerHTML = html;																									
checkoutArea.classList.remove('hidden');																									
} else {																									
content.innerHTML = '<p class="text-gray-500 text-center py-4">現在、このテーブルの注文履歴はありません。</p>';																									
checkoutArea.classList.add('hidden');																									
}																									
})																									
.catch(err => {																									
content.innerHTML = '<p class="text-red-500 text-center py-4">情報の取得に失敗しました。</p>';																									
});																									
}																									
																									
function closeStatusModal() {																									
document.getElementById('status-modal').classList.add('hidden');																									
}																									
																									
function requestCheckout() {																									
if (!currentTableNo) return;																									
																									
const payload = {																									
action: "checkoutByTable",																									
payload: { tableNo: currentTableNo }																									
};																									
																									
fetch(GAS_API_URL, {																									
method: "POST",																									
headers: { "Content-Type": "text/plain;charset=utf-8" },																									
body: JSON.stringify(payload)																									
})																									
.then(res => res.json())																									
.then(res => {																									
closeStatusModal();																									
if (res && res.status === "success") {																									
showReceipt(currentTableNo, res.data.totalPrice, res.data.items);																									
} else {																									
alert("お会計処理に失敗しました: " + (res ? res.message : ""));																									
}																									
})																									
.catch(err => {																									
alert("通信エラーが発生しました。");																									
});																									
}																									
																									
function showReceipt(tableNo, totalPrice, itemsArray) {																									
document.getElementById('receipt-table-no').textContent = tableNo || "-";																									
document.getElementById('receipt-total').textContent = "¥" + totalPrice.toLocaleString();																									
																									
const summaryContainer = document.getElementById('receipt-items-summary');																									
summaryContainer.innerHTML = '';																									
																									
const mergedItems = {};																									
itemsArray.forEach(item => {																									
if (!mergedItems[item.name]) {																									
mergedItems[item.name] = { price: item.price, quantity: 0 };																									
}																									
mergedItems[item.name].quantity += item.quantity;																									
});																									
																									
Object.keys(mergedItems).forEach(name => {																									
const item = mergedItems[name];																									
const div = document.createElement('div');																									
div.className = "flex justify-between text-xs";																									
div.innerHTML = `<span>${name} x${item.quantity}</span><span>¥${(item.price * item.quantity).toLocaleString()}</span>`;																									
summaryContainer.appendChild(div);																									
});																									
																									
document.getElementById('qrcode').innerHTML = "";																									
new QRCode(document.getElementById("qrcode"), { text: "CHECKOUT-" + tableNo + "-" + Date.now(), width: 120, height: 120 });																									
																									
document.getElementById('receipt-modal').classList.remove('hidden');																									
}																									
</script>																									
</body>																									
</html>
