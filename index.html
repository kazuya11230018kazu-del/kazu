/* ==================================================

#ERROR!																									
																									
function setConnectionStatus(ok) {																									
																									
const el =																									
document.getElementById(

/* ==================================================																									
JSONP																									
#ERROR!																									
																									
function callJSONP(																									
action,																									
payload = {}																									
) {																									
																									
return new Promise(																									
(resolve, reject) => {																									
																									
const cbName =																									
jsonp_cb_ +																									
Date.now() +																									
_ +																									
Math.random()																									
.toString(36)																									
.substring(2);																									
																									
																									
const script =																									
document.createElement(																									
script																									
);																									
																									
																									
const timeout =																									
setTimeout(() => {																									
																									
cleanup();																									
																									
reject(																									
new Error(																									
通信がタイムアウトしました																									
)																									
);																									
																									
}, 15000);																									
																									
																									
function cleanup() {																									
																									
clearTimeout(timeout);																									
																									
if (																									
window[cbName]																									
) {																									
																									
delete window[cbName];																									
																									
}																									
																									
																									
if (																									
script.parentNode																									
) {																									
																									
script.parentNode																									
.removeChild(script);																									
																									
}																									
																									
}																									
																									
																									
window[cbName] =																									
function(response) {																									
																									
cleanup();																									
																									
resolve(response);																									
																									
};																									
																									
																									
script.onerror =																									
function() {																									
																									
cleanup();																									
																									
reject(																									
new Error(																									
JSONP通信エラー																									
)																									
);																									
																									
};																									
																									
																									
const params =																									
new URLSearchParams({																									
																									
action: action,																									
																									
callback: cbName,																									
																									
data:																									
JSON.stringify(																									
payload																									
),																									
																									
_: Date.now()																									
																									
});																									
																									
																									
script.src =																									
GAS_API_URL +																									
? +																									
params.toString();																									
																									
																									
document.body																									
.appendChild(script);																									
																									
}																									
);																									
																									
}

setConnectionStatus(true);																									
																									
showReceipt(																									
res.receipt																									
);																									
																									
} else {																									
																									
alert(																									
お会計処理に失敗しました\n +																									
(																									
res.message ||																									
																									
)																									
);																									
																									
}																									
																									
})																									
																									
.catch(err => {																									
																									
console.error(err);																									
																									
setConnectionStatus(false);																									
																									
alert(																									
通信エラーが発生しました																									
);																									
																									
})																									
																									
.finally(() => {																									
																									
button.disabled =																									
false;																									
																									
button.textContent =																									
お会計を確定する;																									
																									
});																									
																									
}

/* ==================================================

#ERROR!																									
																									
function escapeHtml(value) {																									
																									
return String(																									
value ?? ""																									
)																									
.replace(																									
/&/g,																									
&amp;																									
)																									
.replace(																									
/</g,																									
&lt;																									
)																									
.replace(																									
/>/g,																									
&gt;																									
)																									
.replace(																									
/"/g,																									
&quot;																									
)																									
.replace(																									
/'/g,																									
&#039;																									
);																									
																									
}																									
																									
																									
																									
function escapeAttribute(value) {																									
																									
return String(																									
value ?? ""																									
)																									
.replace(																									
/[^a-zA-Z0-9_-]/g,																									
_																									
);																									
																									
}
