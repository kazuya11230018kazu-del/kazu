<!DOCTYPE html>																									
<html lang="ja">																									
<head>																									
<meta charset="UTF-8">																									
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">																									
<title>オーダーシステム</title>																									
<style>																									
* { box-sizing: border-box; }																									
body {																									
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;																									
background-color: #1976d2;																									
color: #333;																									
margin: 0;																									
padding: 0;																									
padding-bottom: 75px;																									
-webkit-text-size-adjust: 100%;																									
}																									
.header {																									
background-color: #1976d2;																									
color: white;																									
text-align: center;																									
padding: 14px;																									
font-size: 16px;																									
font-weight: bold;																									
border-bottom: 1px solid #115293;																									
}																									
.container {																									
background: white;																									
max-width: 600px;																									
margin: 0 auto;																									
min-height: calc(100vh - 55px);																									
padding: 16px;																									
}																									
.btn-red {																									
background-color: #d32f2f;																									
color: white;																									
border: none;																									
padding: 14px 20px;																									
font-size: 16px;																									
border-radius: 6px;																									
width: 100%;																									
cursor: pointer;																									
font-weight: bold;																									
text-align: center;																									
}																									
.btn-green {																									
background-color: #388e3c;																									
color: white;																									
border: none;																									
padding: 12px 14px;																									
font-size: 15px;																									
border-radius: 6px;																									
cursor: pointer;																									
font-weight: bold;																									
}																									
.table-grid, .people-grid {																									
display: grid;																									
grid-template-columns: repeat(3, 1fr);																									
gap: 12px;																									
margin-top: 15px;																									
}																									
.card {																									
background: #f9f9f9;																									
border: 2px solid #ccc;																									
border-radius: 8px;																									
padding: 20px 10px;																									
text-align: center;																									
font-size: 18px;																									
font-weight: bold;																									
color: #1976d2;																									
cursor: pointer;																									
}																									
.menu-item {																									
display: flex;																									
justify-content: space-between;																									
align-items: center;																									
border-bottom: 1px solid #eee;																									
padding: 14px 0;																									
}																									
.footer-nav {																									
position: fixed;																									
bottom: 0;																									
left: 0;																									
width: 100%;																									
background: #1976d2;																									
display: flex;																									
justify-content: space-around;																									
padding: 6px 4px;																									
border-top: 2px solid #115293;																									
z-index: 100;																									
}																									
.nav-btn {																									
background: white;																									
border: 1px solid #ccc;																									
padding: 6px 2px;																									
font-size: 11px;																									
font-weight: bold;																									
border-radius: 4px;																									
text-align: center;																									
flex: 1;																									
margin: 0 2px;																									
cursor: pointer;																									
color: #333;																									
line-height: 1.3;																									
}																									
.nav-btn.active {																									
border: 2px solid #ff9800;																									
box-shadow: 0 0 5px rgba(255,152,0,0.5);																									
}																									
.hidden { display: none !important; }																									
table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }																									
th, td { border: 1px solid #ddd; padding: 10px 8px; text-align: left; }																									
th { background-color: #f2f2f2; }																									
input[type="number"] {																									
font-size: 16px;																									
padding: 6px;																									
border: 1px solid #ccc;																									
border-radius: 4px;																									
width: 55px;																									
text-align: center;																									
}																									
#loading {																									
position: fixed; top: 0; left: 0; width: 100%; height: 100%;																									
background: rgba(0,0,0,0.5); color: white; display: flex;																									
justify-content: center; align-items: center; font-size: 18px; z-index: 999;																									
}																									
</style>																									
</head>																									
<body>																									
																									
<div id="loading" class="hidden">通信中...</div>																									
<div class="header">テーブル <span id="display-table-no">1</span></div>																									
																									
<!-- ⓪ テーブル選択画面 -->																									
<div id="view-table-select" class="container hidden" style="text-align: center; padding-top: 30px;">																									
<h3>テーブル番号を選択してください</h3>																									
<div class="table-grid" id="table-grid-buttons"></div>																									
</div>																									
																									
<!-- ① スタート画面 -->																									
<div id="view-start" class="container hidden" style="text-align: center; padding-top: 80px;">																									
<h2 style="color: #333; margin-bottom: 40px;">いらっしゃいませ</h2>																									
<button class="btn-red" style="font-size: 18px; padding: 16px;" onclick="goToPeople()">注文をはじめる</button>																									
</div>																									
																									
<!-- ② 人数選択画面 -->																									
<div id="view-people" class="container hidden">																									
<h3 style="text-align: center; margin-bottom: 20px; color: #333;">何名様(全員)でご利用ですか？</h3>																									
<div class="people-grid">																									
<div class="card" onclick="setPeople(1)">1人</div>																									
<div class="card" onclick="setPeople(2)">2人</div>																									
<div class="card" onclick="setPeople(3)">3人</div>																									
<div class="card" onclick="setPeople(4)">4人</div>																									
<div class="card" onclick="setPeople(5)">5人</div>																									
<div class="card" onclick="setPeople(6)">6人</div>																									
<div class="card" onclick="setPeople(7)">7人</div>																									
<div class="card" onclick="setPeople(8)">8人</div>																									
<div class="card" onclick="setPeople(9)">9人以上</div>																									
</div>																									
</div>																									
																									
<!-- ③ メニュー画面 -->																									
<div id="view-menu" class="container hidden">																									
<div style="background: #1976d2; color: white; padding: 10px; text-align: center; font-weight: bold; margin: -16px -16px 15px -16px;">																									
数量を選択してください																									
</div>																									
<div id="menu-list"></div>																									
<div style="display: flex; gap: 10px; margin-top: 25px;">																									
<button class="btn-green" style="flex: 1;" onclick="goToPeople()">もどる</button>																									
<button class="btn-red" style="flex: 2;" onclick="showCart()">注文かごへ追加する</button>																									
</div>																									
</div>																									
																									
<!-- ④ 注文かご確認画面 -->																									
<div id="view-cart" class="container hidden">																									
<div style="background: #1976d2; color: white; padding: 10px; text-align: center; font-weight: bold; margin: -16px -16px 15px -16px;">																									
他に注文があれば「追加」、なければ「注文」																									
</div>																									
<div id="cart-list"></div>																									
<p style="text-align: right; font-weight: bold; font-size: 18px; margin-top: 15px;">合計: <span id="cart-total">0</span>円 (税込)</p>																									
<div style="display: flex; gap: 10px; margin-top: 20px;">																									
<button class="btn-green" style="flex: 1;" onclick="goToMenu()">追加</button>																									
<button class="btn-red" style="flex: 2;" onclick="sendOrder()">注文</button>																									
</div>																									
</div>																									
																									
<!-- ⑤ 注文完了画面 -->																									
<div id="view-complete" class="container hidden" style="text-align: center; padding-top: 60px;">																									
<h3 style="color: #388e3c;">ご注文を受け付けました</h3>																									
<p style="color: #666; margin: 20px 0;">商品の到着までしばらくお待ちください。</p>																									
<button class="btn-green" onclick="goToMenu()" style="width: 100%; padding: 14px;">続けて注文する</button>																									
</div>																									
																									
<!-- ⑥ 注文履歴画面 -->																									
<div id="view-history" class="container hidden">																									
<div style="background: #1976d2; color: white; padding: 10px; text-align: center; font-weight: bold; margin: -16px -16px 15px -16px;">																									
注文内容をご確認ください																									
</div>																									
<div id="history-list">読み込み中...</div>																									
<p style="text-align: center; font-size: 12px; color: #666; margin: 15px 0;">注文の反映には数分かかることがございます</p>																									
<p style="text-align: right; font-weight: bold; font-size: 18px; margin-top: 10px;">合計: <span id="history-total">0</span>円 (税込)</p>																									
<button class="btn-green" onclick="goToMenu()" style="width: 100%; margin-top: 15px;">メニューに戻る</button>																									
</div>																									
																									
<!-- ⑦ お会計確認画面 -->																									
<div id="view-checkout" class="container hidden">																									
<div style="background: #1976d2; color: white; padding: 10px; text-align: center; font-weight: bold; margin: -16px -16px 15px -16px;">																									
お帰りの際は[お支払いへ進む]をタップ																									
</div>																									
<div id="checkout-list"></div>																									
<p style="text-align: right; font-weight: bold; font-size: 18px; margin-top: 15px;">合計: <span id="checkout-total">0</span>円 (税込)</p>																									
<button class="btn-red" style="margin-top: 20px;" onclick="processCheckout()">お支払いへ進む</button>																									
<button class="btn-green" style="width: 100%; margin-top: 10px;" onclick="goToMenu()">メニューに戻る</button>																									
</div>																									
																									
<!-- ⑧ お会計完了画面 -->																									
<div id="view-checkout-complete" class="container hidden" style="text-align: center; padding-top: 60px;">																									
<h3 style="color: #388e3c;">お会計が完了しました</h3>																									
<p style="color: #666; margin: 20px 0;">ご来店ありがとうございました！</p>																									
<button class="btn-green" onclick="location.href='?table=' + currentTableNo" style="width: 100%; padding: 14px;">最初に戻る</button>																									
</div>																									
																									
<!-- フッターナビゲーション -->																									
<div class="footer-nav">																									
<button class="nav-btn" id="nav-menu" onclick="goToMenu()">注文<br>追加</button>																									
<button class="nav-btn" id="nav-cart" onclick="showCart()">注文<br>かご</button>																									
<button class="nav-btn" id="nav-history" onclick="showHistory()">注文<br>履歴</button>																									
<button class="nav-btn" id="nav-call" onclick="alert('スタッフをお呼びします')">店員<br>呼出</button>																									
<button class="nav-btn" id="nav-checkout" onclick="showCheckout()">会計<br>する</button>																									
</div>																									
																									
<script>																									
const GAS_URL = "https://script.google.com/macros/s/AKfycbxXmQqy2d4Fi76weIBQFGG1Mmz-doCL5MLsuxOsUWdo8szj-RjRZ3e2DYB0J5ln_YDR/exec";																									
																									
const urlParams = new URLSearchParams(window.location.search);																									
let currentTableNo = urlParams.get('table');																									
																									
let state = { people: 1, cart: [] };																									
let menuData = [];																									
																									
window.onload = function() {																									
if (!currentTableNo || isNaN(currentTableNo) || currentTableNo < 1 || currentTableNo > 10) {																									
let html = "";																									
for (let i = 1; i <= 10; i++) {																									
html += `<div class="card" onclick="selectTable(${i})">テーブル ${i}</div>`;																									
}																									
document.getElementById('table-grid-buttons').innerHTML = html;																									
switchView('view-table-select');																									
} else {																									
document.getElementById('display-table-no').innerText = currentTableNo;																									
switchView('view-start');																									
}																									
};																									
																									
function selectTable(num) {																									
currentTableNo = num;																									
document.getElementById('display-table-no').innerText = currentTableNo;																									
switchView('view-start');																									
}																									
																									
function showLoading(show) {																									
document.getElementById('loading').classList.toggle('hidden', !show);																									
}																									
																									
function switchView(viewId) {																									
document.querySelectorAll('.container').forEach(el => el.classList.add('hidden'));																									
document.getElementById(viewId).classList.remove('hidden');																									
window.scrollTo(0, 0);																									
																									
document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));																									
if (viewId === 'view-menu') document.getElementById('nav-menu').classList.add('active');																									
if (viewId === 'view-cart') document.getElementById('nav-cart').classList.add('active');																									
if (viewId === 'view-history') document.getElementById('nav-history').classList.add('active');																									
if (viewId === 'view-checkout') document.getElementById('nav-checkout').classList.add('active');																									
}																									
																									
function goToPeople() { switchView('view-people'); }																									
																									
function setPeople(num) {																									
state.people = num;																									
loadMenu();																									
}																									
																									
async function loadMenu() {																									
showLoading(true);																									
try {																									
let res = await fetch(GAS_URL + "?action=menu");																									
let text = await res.text();																									
menuData = JSON.parse(text);																									
renderMenu();																									
switchView('view-menu');																									
} catch (e) {																									
alert("メニューの読み込みに失敗しました。");																									
} finally {																									
showLoading(false);																									
}																									
}																									
																									
function renderMenu() {																									
let html = "";																									
menuData.forEach((item, index) => {																									
html += `<div class="menu-item">																									
<div>																									
<strong>${item.name}</strong><br>																									
<span style="color:#666; font-size:14px;">${item.price}円</span>																									
</div>																									
<div style="display: flex; align-items: center; gap: 6px;">																									
<button class="btn-green" style="padding: 4px 10px;" onclick="changeQty(${index}, -1)">-</button>																									
<input type="number" id="qty-${index}" value="0" min="0">																									
<button class="btn-green" style="padding: 4px 10px;" onclick="changeQty(${index}, 1)">+</button>																									
</div>																									
</div>`;																									
});																									
document.getElementById('menu-list').innerHTML = html;																									
}																									
																									
function changeQty(index, delta) {																									
let input = document.getElementById(`qty-${index}`);																									
let val = parseInt(input.value) || 0;																									
val += delta;																									
if (val < 0) val = 0;																									
input.value = val;																									
}																									
																									
function showCart() {																									
menuData.forEach((item, index) => {																									
let qtyInput = document.getElementById(`qty-${index}`);																									
if (qtyInput) {																									
let qty = parseInt(qtyInput.value) || 0;																									
if (qty > 0) {																									
let existing = state.cart.find(c => c.id === item.id);																									
if (existing) {																									
existing.quantity += qty;																									
} else {																									
state.cart.push({ id: item.id, name: item.name, price: item.price, quantity: qty });																									
}																									
qtyInput.value = "0";																									
}																									
}																									
});																									
																									
let html = "";																									
let total = 0;																									
if (state.cart.length === 0) {																									
html = "<p style='text-align:center; color:#666; padding:20px;'>注文かごは空です</p>";																									
} else {																									
html = "<table><tr><th>商品名</th><th>数量</th><th>価格</th></tr>";																									
state.cart.forEach(item => {																									
let subtotal = item.price * item.quantity;																									
html += `<tr><td>${item.name}</td><td>${item.quantity}</td><td>${subtotal}円</td></tr>`;																									
total += subtotal;																									
});																									
html += "</table>";																									
}																									
																									
document.getElementById('cart-list').innerHTML = html;																									
document.getElementById('cart-total').innerText = total;																									
switchView('view-cart');																									
}																									
																									
function goToMenu() {																									
if(menuData.length > 0) {																									
switchView('view-menu');																									
} else {																									
loadMenu();																									
}																									
}																									
																									
// 【超高速化】注文ボタン：裏で送信しつつ、画面は一瞬で完了画面へ切り替える																									
function sendOrder() {																									
if (state.cart.length === 0) {																									
alert("注文する商品がありません（数量を選択してください）");																									
return;																									
}																									
																									
// 1. 画面を即座に「完了」にする（待ち時間ゼロ）																									
let payload = { type: "order", tableNo: currentTableNo, people: state.people, items: [...state.cart] };																									
state.cart = [];																									
switchView('view-complete');																									
																									
// 2. データの送信は裏（バックグラウンド）でこっそり行う																									
fetch(GAS_URL, {																									
method: "POST",																									
mode: "no-cors",																									
body: JSON.stringify(payload)																									
}).catch(err => console.log(err));																									
}																									
																									
async function showHistory() {																									
showLoading(true);																									
try {																									
let res = await fetch(GAS_URL + `?action=getBill&tableNo=${currentTableNo}`);																									
let text = await res.text();																									
let data = JSON.parse(text);																									
																									
let html = "";																									
if (data.items.length === 0) {																									
html = "<p style='text-align:center; color:#666; padding:20px;'>注文履歴はありません</p>";																									
} else {																									
html = "<table><tr><th>メニュー名</th><th>数量</th><th>価格</th></tr>";																									
data.items.forEach(item => {																									
html += `<tr><td>${item.name}</td><td>${item.quantity}</td><td>${item.subtotal}</td></tr>`;																									
});																									
html += "</table>";																									
}																									
document.getElementById('history-list').innerHTML = html;																									
document.getElementById('history-total').innerText = data.total;																									
switchView('view-history');																									
} catch (e) {																									
alert("履歴の取得に失敗しました");																									
} finally {																									
showLoading(false);																									
}																									
}																									
																									
async function showCheckout() {																									
showLoading(true);																									
try {																									
let res = await fetch(GAS_URL + `?action=getBill&tableNo=${currentTableNo}`);																									
let text = await res.text();																									
let data = JSON.parse(text);																									
																									
if (data.items.length === 0) {																									
alert("未会計の注文はありません");																									
showLoading(false);																									
return;																									
}																									
let html = "<table><tr><th>メニュー名</th><th>数量</th><th>価格</th></tr>";																									
data.items.forEach(item => {																									
html += `<tr><td>${item.name}</td><td>${item.quantity}</td><td>${item.subtotal}</td></tr>`;																									
});																									
html += "</table>";																									
document.getElementById('checkout-list').innerHTML = html;																									
document.getElementById('checkout-total').innerText = data.total;																									
switchView('view-checkout');																									
} catch (e) {																									
alert("お会計データの取得に失敗しました");																									
} finally {																									
showLoading(false);																									
}																									
}																									
																									
// 【超高速化】お会計ボタン：裏で処理しつつ、画面を即座に完了画面へ																									
function processCheckout() {																									
if (!confirm("お支払いへ進んでよろしいですか？")) return;																									
																									
let payload = { type: "checkout", tableNo: currentTableNo };																									
switchView('view-checkout-complete');																									
																									
fetch(GAS_URL, {																									
method: "POST",																									
mode: "no-cors",																									
body: JSON.stringify(payload)																									
}).catch(err => console.log(err));																									
}																									
</script>																									
</body>																									
</html>
