<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>モバイルオーダー</title>
<script src='https://cdn.tailwindcss.com'></script>
<script defer src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'></script>
</head>

<body class='bg-gray-50 text-gray-800 pb-28'>

<header class='bg-indigo-600 text-white p-4 flex justify-between items-center shadow'>
  <div>
    <h1 class='text-lg font-bold'>モバイルオーダー</h1>
    <p class='text-xs'>
      テーブル:
      <span id='tableDisplay'>未設定</span>
    </p>
  </div>

  <div class='flex gap-2 items-center'>
    <button
      id='statusBtn'
      class='bg-indigo-500 px-3 py-2 rounded-lg text-xs font-bold'
    >
      注文状況・会計
    </button>

    <span
      id='connection'
      class='bg-yellow-500 px-2 py-1 rounded text-xs'
    >
      接続確認中
    </span>
  </div>
</header>

<main class='max-w-md mx-auto p-4'>

  <div
    id='loading'
    class='text-center text-gray-500 py-12'
  >
    メニューを読み込んでいます...
  </div>

  <div
    id='menu'
    class='space-y-3 hidden'
  ></div>

</main>

<div
  id='cartBar'
  class='fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg hidden max-w-md mx-auto flex justify-between items-center'
>
  <div>
    <div class='text-sm'>
      <span id='cartCount'>0</span>点
    </div>

    <div class='font-bold text-indigo-600 text-lg'>
      ¥<span id='cartTotal'>0</span>
    </div>
  </div>

  <button
    id='cartBtn'
    class='bg-indigo-600 text-white px-5 py-3 rounded-xl font-bold'
  >
    カート確認
  </button>
</div>

<div
  id='tableModal'
  class='fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4'
>
  <div class='bg-white w-full max-w-sm rounded-2xl p-6 space-y-4 text-center'>

    <h2 class='text-xl font-bold'>
      テーブル番号を入力
    </h2>

    <p class='text-sm text-gray-500'>
      お座りのテーブル番号を入力してください
    </p>

    <input
      id='tableInput'
      type='number'
      inputmode='numeric'
      placeholder='例: 3'
      class='w-full border rounded-xl p-4 text-center text-2xl font-bold'
    >

    <button
      id='tableStartBtn'
      class='w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-lg'
    >
      注文を始める
    </button>

  </div>
</div>

<div
  id='cartModal'
  class='fixed inset-0 bg-black/60 z-50 hidden items-end justify-center'
>
  <div class='bg-white w-full max-w-md rounded-t-2xl p-5 max-h-[90vh] overflow-y-auto'>

    <div class='flex justify-between items-center border-b pb-3'>
      <h2 class='font-bold text-lg'>
        注文内容
      </h2>

      <button id='cartCloseBtn' class='text-2xl'>
        ×
      </button>
    </div>

    <div
      id='cartItems'
      class='space-y-3 py-4'
    ></div>

    <div class='flex justify-between font-bold text-lg border-t pt-4'>
      <span>合計</span>
      <span>
        ¥<span id='cartModalTotal'>0</span>
      </span>
    </div>

    <button
      id='submitBtn'
      class='w-full bg-indigo-600 text-white py-4 rounded-xl font-bold mt-4'
    >
      注文を確定する
    </button>

  </div>
</div>

<div
  id='statusModal'
  class='fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4'
>
  <div class='bg-white w-full max-w-md rounded-2xl p-5 max-h-[90vh] overflow-y-auto'>

    <div class='flex justify-between border-b pb-3'>
      <h2 class='font-bold text-lg'>
        注文状況・会計
      </h2>

      <button id='statusCloseBtn' class='text-2xl'>
        ×
      </button>
    </div>

    <div
      id='statusContent'
      class='space-y-3 py-4'
    ></div>

    <button
      id='checkoutBtn'
      class='w-full bg-green-600 text-white py-4 rounded-xl font-bold hidden'
    >
      お会計する
    </button>

  </div>
</div>

<div
  id='receiptModal'
  class='fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4'
>
  <div class='bg-white w-full max-w-md rounded-2xl p-5 text-center max-h-[90vh] overflow-y-auto'>

    <div class='text-5xl text-green-600'>
      ✓
    </div>

    <h2 class='text-xl font-bold mt-2'>
      お会計完了
    </h2>

    <p class='text-sm mt-2'>
      注文ID:
      <span id='receiptOrderId'></span>
    </p>

    <div class='border border-dashed rounded-xl p-4 mt-4 text-left'>

      <div
        id='receiptItems'
        class='space-y-2'
      ></div>

      <hr class='my-3'>

      <div class='flex justify-between font-bold text-lg'>
        <span>合計</span>
        <span id='receiptTotal'>¥0</span>
      </div>

    </div>

    <div
      id='qrcode'
      class='flex justify-center mt-4'
    ></div>

    <button
      id='receiptCloseBtn'
      class='w-full bg-gray-200 py-4 rounded-xl font-bold mt-4'
    >
      閉じる
    </button>

  </div>
</div>

<script>

const GAS_API_URL='https://script.google.com/macros/s/AKfycbxzxAT7w9VscVWSYeCGs0b0BSzw_FSV58ijndShy6Jrn_27p0Abw4O3bru6KK_vCCK2iQ/exec';

let menuData=[];
let cart={};

let tableNo=
  localStorage.getItem('order_table_no') || '';

let orderId=
  localStorage.getItem('order_id') || '';

document.addEventListener('DOMContentLoaded',function(){

  document.getElementById('tableStartBtn').onclick=setTable;
  document.getElementById('cartBtn').onclick=openCart;
  document.getElementById('cartCloseBtn').onclick=closeCart;
  document.getElementById('submitBtn').onclick=submitOrder;
  document.getElementById('statusBtn').onclick=openStatus;
  document.getElementById('statusCloseBtn').onclick=closeStatus;
  document.getElementById('checkoutBtn').onclick=checkout;
  document.getElementById('receiptCloseBtn').onclick=closeReceipt;

  if(tableNo){
    document.getElementById('tableDisplay').textContent=tableNo+'番';
    document.getElementById('tableModal').classList.add('hidden');
  }

  loadMenu();

});

function setConnection(ok){

  const el=document.getElementById('connection');

  if(ok){
    el.textContent='接続完了';
    el.className='bg-green-500 px-2 py-1 rounded text-xs';
  }else{
    el.textContent='通信エラー';
    el.className='bg-red-500 px-2 py-1 rounded text-xs';
  }

}

function setTable(){

  const input=document.getElementById('tableInput');

  const value=String(input.value || '').trim();

  if(!value){
    alert('テーブル番号を入力してください');
    return;
  }

  tableNo=value;

  localStorage.setItem(
    'order_table_no',
    tableNo
  );

  document.getElementById('tableDisplay').textContent=
    tableNo+'番';

  document.getElementById('tableModal').classList.add('hidden');

}

function loadMenu(){

  fetch(
    GAS_API_URL+'?action=getMenu'
  )

  .then(function(response){

    if(!response.ok){
      throw new Error('HTTP '+response.status);
    }

    return response.json();

  })

  .then(function(result){

    if(
      !result ||
      result.status!=='success'
    ){
      throw new Error(
        result && result.message
          ? result.message
          : 'メニュー取得失敗'
      );
    }

    setConnection(true);

    menuData=result.data || [];

    document.getElementById('loading').classList.add('hidden');

    renderMenu();

  })

  .catch(function(error){

    setConnection(false);

    document.getElementById('loading').innerHTML=
      '<span class="text-red-500">'+
      safe(error.message)+
      '</span>';

  });

}

function renderMenu(){

  const container=document.getElementById('menu');

  container.innerHTML='';
  container.classList.remove('hidden');

  if(menuData.length===0){

    container.innerHTML=
      '<div class="text-center text-gray-500 py-10">メニューがありません</div>';

    return;
  }

  menuData.forEach(function(item){

    const code=String(item.code || '');

    const qty=
      cart[code]
        ? cart[code].quantity
        : 0;

    const card=document.createElement('div');

    card.className=
      'bg-white border rounded-xl p-4 flex justify-between items-center shadow-sm';

    const left=document.createElement('div');

    left.innerHTML=
      '<div class="font-bold">'+safe(item.name)+'</div>'+
      '<div class="text-indigo-600 font-bold">¥'+money(item.price)+'</div>'+
      '<div class="text-xs text-gray-400">'+safe(item.category || '')+'</div>';

    const right=document.createElement('div');

    right.className='flex items-center gap-3';

    const minus=document.createElement('button');
    minus.textContent='−';
    minus.className='w-9 h-9 rounded-full bg-gray-100 font-bold';

    const count=document.createElement('span');
    count.textContent=String(qty);
    count.className='font-bold w-5 text-center';

    const plus=document.createElement('button');
    plus.textContent='+';
    plus.className='w-9 h-9 rounded-full bg-indigo-600 text-white font-bold';

    minus.onclick=function(){
      changeQuantity(item,-1);
    };

    plus.onclick=function(){
      changeQuantity(item,1);
    };

    right.appendChild(minus);
    right.appendChild(count);
    right.appendChild(plus);

    card.appendChild(left);
    card.appendChild(right);

    container.appendChild(card);

  });

}

function changeQuantity(item,delta){

  const code=String(item.code || '');

  if(!cart[code]){

    if(delta<0){
      return;
    }

    cart[code]={
      code:code,
      name:item.name,
      price:Number(item.price) || 0,
      category:item.category || '',
      quantity:0
    };

  }

  cart[code].quantity+=delta;

  if(cart[code].quantity<=0){
    delete cart[code];
  }

  renderMenu();
  updateCart();

}

function updateCart(){

  let count=0;
  let total=0;

  Object.values(cart).forEach(function(item){

    count+=item.quantity;

    total+=
      item.price *
      item.quantity;

  });

  document.getElementById('cartCount').textContent=count;

  document.getElementById('cartTotal').textContent=
    money(total);

  const bar=document.getElementById('cartBar');

  if(count>0){
    bar.classList.remove('hidden');
  }else{
    bar.classList.add('hidden');
  }

}

function openCart(){

  const box=document.getElementById('cartItems');

  box.innerHTML='';

  let total=0;

  Object.values(cart).forEach(function(item){

    const subtotal=
      item.price *
      item.quant
