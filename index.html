<!DOCTYPE html>																									
<html lang="ja">																									
<head>																									
<meta charset="UTF-8">																									
<meta name="viewport" content="width=device-width, initial-scale=1.0">																									
<title>モバイルオーダーシステム</title>																									
<!-- Tailwind CSS -->																									
<script src="https://cdn.tailwindcss.com"></script>																									
<!-- QR Code Generator -->																									
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>																									
</head>																									
<body class="bg-blue-900 text-gray-800 pb-20 select-none">																									
																									
<!-- ================= 1. ウェルカム画面 ================= -->																									
<div id="screen-welcome" class="fixed inset-0 bg-blue-900 z-50 flex flex-col justify-between items-center p-6 text-white">																									
<div class="w-full text-center pt-8">																									
<p class="text-xl font-bold tracking-widest text-blue-100">いらっしゃいませ</p>																									
</div>																									
<div class="bg-white w-full max-w-sm rounded-3xl p-8 text-center shadow-2xl space-y-6 my-auto">																									
<div class="border-2 border-blue-600 rounded-full py-2 px-4 inline-block mx-auto bg-blue-50">																									
<span class="text-blue-800 font-bold text-sm">セルフモバイルオーダー</span>																									
</div>																									
<div class="text-3xl font-extrabold text-blue-900 tracking-wider">レストラン オーダー</div>																									
<button onclick="goToPeopleScreen()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 rounded-2xl text-xl shadow-lg transition transform active:scale-95">																									
注文をはじめる																									
</button>																									
</div>																									
<div class="text-xs text-blue-300 pb-4">																									
&copy; Mobile Order System. All rights reserved.																									
</div>																									
</div>																									
																									
<!-- ================= 2. 人数選択画面 ================= -->																									
<div id="screen-people" class="fixed inset-0 bg-blue-900 z-40 hidden flex flex-col justify-between p-4 text-white">																									
<div class="text-center py-4 bg-blue-800 rounded-xl shadow">																									
<h2 class="text-lg font-bold">何名様(全員)でご利用ですか？</h2>																									
</div>																									
<div class="grid grid-cols-3 gap-3 my-auto max-w-md mx-auto w-full px-2">																									
<button onclick="selectTableAndStart('1人')" class="bg-gray-100 text-blue-900 font-bold py-6 rounded-2xl text-xl shadow hover:bg-blue-50 transition active:scale-95">1人</button>																									
<button onclick="selectTableAndStart('2人')" class="bg-gray-100 text-blue-900 font-bold py-6 rounded-2xl text-xl shadow hover:bg-blue-50 transition active:scale-95">2人</button>																									
<button onclick="selectTableAndStart('3人')" class="bg-gray-100 text-blue-900 font-bold py-6 rounded-2xl text-xl shadow hover:bg-blue-50 transition active:scale-95">3人</button>																									
<button onclick="selectTableAndStart('4人')" class="bg-gray-100 text-blue-900 font-bold py-6 rounded-2xl text-xl shadow hover:bg-blue-50 transition active:scale-95">4人</button>																									
<button onclick="selectTableAndStart('5人')" class="bg-gray-100 text-blue-900 font-bold py-6 rounded-2xl text-xl shadow hover:bg-blue-50 transition active:scale-95">5人</button>																									
<button onclick="selectTableAndStart('6人')" class="bg-gray-100 text-blue-900 font-bold py-6 rounded-2xl text-xl shadow hover:bg-blue-50 transition active:scale-95">6人</button>																									
<button onclick="selectTableAndStart('7人')" class="bg-gray-100 text-blue-900 font-bold py-6 rounded-2xl text-xl shadow hover:bg-blue-50 transition active:scale-95">7人</button>																									
<button onclick="selectTableAndStart('8人')" class="bg-gray-100 text-blue-900 font-bold py-6 rounded-2xl text-xl shadow hover:bg-blue-50 transition active:scale-95">8人</button>																									
<button onclick="selectTableAndStart('9人以上')" class="bg-gray-100 text-blue-900 font-bold py-6 rounded-2xl text-lg shadow hover:bg-blue-50 transition active:scale-95">9人以上</button>																									
</div>																									
<div></div>																									
</div>																									
																									
<!-- ================= 3. メイン画面（メニュー閲覧・注文） ================= -->																									
<div id="screen-main" class="max-w-md mx-auto min-h-screen bg-white hidden flex flex-col">																									
<!-- ヘッダー -->																									
<header class="bg-blue-900 text-white p-3 sticky top-0 z-20 shadow flex justify-between items-center">																									
<span class="text-xs font-bold text-blue-200">テーブル: <span id="display-table">1</span>番</span>																									
<span class="text-xs bg-blue-800 px-2 py-1 rounded text-blue-100 font-bold">接続中</span>																									
</header>																									
																									
<!-- 各タブのコンテナ -->																									
<div class="flex-grow p-4 pb-28">																									
<!-- Tab A: メニュー一覧（注文追加） -->																									
<div id="tab-menu" class="space-y-4">																									
<div class="text-center py-2 bg-blue-50 rounded-lg text-blue-900 text-xs font-bold border border-blue-200">																									
メニューを選んで数量を指定してください																									
</div>																									
<div id="menu-container" class="space-y-3"></div>																									
</div>																									
																									
<!-- Tab B: 注文かご -->																									
<div id="tab-cart" class="space-y-4 hidden">																									
<h2 class="text-base font-bold text-gray-700 border-b pb-2">注文かごの中身</h2>																									
<div id="cart-items-list" class="space-y-3 max-h-[60vh] overflow-y-auto"></div>																									
<div class="border-t pt-3">																									
<div class="flex justify-between text-lg font-bold mb-4">																									
<span>合計金額（税込）</span>																									
<span class="text-blue-700">¥<span id="cart-total">0</span></span>																									
</div>																									
<div class="flex space-x-2">																									
<button onclick="switchTab('menu')" class="w-1/2 bg-gray-300 text-gray-700 py-3 rounded-xl font-bold hover:bg-gray-400 transition">追加</button>																									
<button onclick="submitOrder()" class="w-1/2 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow">注文する</button>																									
</div>																									
</div>																									
</div>																									
																									
<!-- Tab C: 注文履歴 -->																									
<div id="tab-history" class="space-y-4 hidden">																									
<h2 class="text-base font-bold text-gray-700 border-b pb-2">注文履歴・状況</h2>																									
<div id="history-items-list" class="space-y-3 max-h-[65vh] overflow-y-auto">																									
<p class="text-gray-400 text-center py-8 text-sm">読み込み中...</p>																									
</div>																									
</div>																									
																									
<!-- Tab D: 店員呼出 -->																									
<div id="tab-call" class="space-y-6 text-center py-10 hidden">																									
<div class="text-5xl">🔔</div>																									
<h2 class="text-xl font-bold text-gray-800">従業員の呼び出し</h2>																									
<p class="text-sm text-gray-500 px-4">ご要望やご不明な点がある場合は、ボタンを押して従業員をお呼びください。</p>																									
<button onclick="callStaff()" class="mx-auto bg-amber-600 text-white px-8 py-4 rounded-2xl font-bold text-lg shadow hover:bg-amber-700 transition">																									
店員を呼び出す																									
</button>																									
</div>																									
																									
<!-- Tab E: 会計する -->																									
<div id="tab-checkout" class="space-y-4 hidden">																									
<h2 class="text-base font-bold text-gray-700 border-b pb-2">お会計の確認</h2>																									
<div id="checkout-items-list" class="space-y-3 max-h-[55vh] overflow-y-auto">																									
<p class="text-gray-400 text-center py-8 text-sm">読み込み中...</p>																									
</div>																									
<div class="border-t pt-3">																									
<div class="flex justify-between text-lg font-bold mb-4">																									
<span>お支払い総額</span>																									
<span class="text-blue-700">¥<span id="checkout-total">0</span></span>																									
</div>																									
<button onclick="requestCheckout()" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold text-base hover:bg-blue-700 transition shadow">																									
お支払いへ進む																									
</button>																									
</div>																									
</div>																									
</div>																									
</div>																									
																									
<!-- ================= 4. 下部固定ナビバー ================= -->																									
<nav id="footer-nav" class="fixed bottom-0 left-0 right-0 bg-blue-900 border-t border-blue-800 py-2 px-1 grid grid-cols-5 gap-1 shadow-2xl z-30 max-w-md mx-auto hidden">																									
<button onclick="switchTab('menu')" id="nav-menu" class="flex flex-col items-center justify-center py-1 text-white text-[11px] font-bold rounded-lg bg-blue-800 shadow-inner">																									
<span class="text-base mb-0.5">➕</span>																									
<span>注文追加</span>																									
</button>																									
<button onclick="switchTab('cart')" id="nav-cart" class="flex flex-col items-center justify-center py-1 text-blue-200 text-[11px] font-bold rounded-lg relative">																									
<span class="text-base mb-0.5">🛒</span>																									
<span>注文かご</span>																									
<span id="badge-cart" class="absolute top-1 right-3 bg-red-600 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center hidden font-bold">0</span>																									
</button>																									
<button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center justify-center py-1 text-blue-200 text-[11px] font-bold rounded-lg">																									
<span class="text-base mb-0.5">📋</span>																									
<span>注文履歴</span>																									
</button>																									
<button onclick="switchTab('call')" id="nav-call" class="flex flex-col items-center justify-center py-1 text-blue-200 text-[11px] font-bold rounded-lg">																									
<span class="text-base mb-0.5">🔔</span>																									
<span>店員呼出</span>																									
</button>																									
<button onclick="switchTab('checkout')" id="nav-checkout" class="flex flex-col items-center justify-center py-1 text-blue-200 text-[11px] font-bold rounded-lg">																									
<span class="text-base mb-0.5">💰</span>																									
<span>会計する</span>																									
</button>																									
</nav>																									
																									
<!-- ================= 5. 領収書・完了画面モーダル ================= -->																									
<div id="receipt-modal" class="fixed inset-0 bg-black bg-opacity-70 z-50 hidden flex items-center justify-center p-4">																									
<div class="bg-white w-full max-w-md rounded-2xl p-6 text-center space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">																									
<div class="text-blue-600 text-5xl font-bold">✓</div>																									
<h2 class="text-xl font-bold text-gray-800">お会計が完了しました</h2>																									
<p class="text-sm text-gray-500">テーブル: <span id="receipt-table-no" class="font-bold text-gray-700"></span>番</p>																									
<div class="border border-dashed border-gray-300 p-4 rounded-xl text-left text-sm space-y-2 bg-gray-50">																									
<div class="text-center font-bold border-b pb-2 text-gray-700">デジタル領収書</div>																									
<div id="receipt-items-summary" class="py-2 space-y-1 border-b"></div>																									
<div class="flex justify-between font-bold text-base pt-1 text-gray-800">																									
<span>合計金額</span>																									
<span id="receipt-total">¥0</span>																									
</div>																									
</div>																									
<div class="flex flex-col items-center justify-center space-y-1 pt-2">																									
<div id="qrcode" class="p-2 bg-white border rounded shadow-sm inline-block"></div>																									
<span class="text-xs text-gray-400">お会計確認用QRコード</span>																									
</div>																									
<button onclick="location.reload()" class="w-full bg-gray-200 text-gray-700 py-3 rounded-xl font-bold hover:bg-gray-300 transition">																									
最初に戻る																									
</button>																									
</div>																									
</div>																									
																									
<script>																									
// 新しく発行された正しいGASのWebアプリURLを設定済み																									
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx1KxRv4QBFyEgXzlOmbp9VswB7pI0fRkX3hSX21Sxj0lmxURYX0PQNIteHUJNQqlAmYQ/exec";																									
																									
let menuData = [];																									
let cart = {};																									
let currentTableNo = "1";																									
																									
function goToPeopleScreen() {																									
document.getElementById('screen-welcome').classList.add('hidden');																									
document.getElementById('screen-people').classList.remove('hidden');																									
}																									
																									
function selectTableAndStart(peopleCount) {																									
currentTableNo = "1";																									
document.getElementById('display-table').textContent = currentTableNo;																									
document.getElementById('screen-people').classList.add('hidden');																									
document.getElementById('screen-main').classList.remove('hidden');																									
document.getElementById('footer-nav').classList.remove('hidden');																									
fetchMenu();																									
}																									
																									
function switchTab(tabName) {																									
['menu', 'cart', 'history', 'call', 'checkout'].forEach(t => {																									
document.getElementById('tab-' + t).classList.add('hidden');																									
const navBtn = document.getElementById('nav-' + t);																									
navBtn.className = "flex flex-col items-center justify-center py-1 text-blue-200 text-[11px] font-bold rounded-lg";																									
});																									
																									
document.getElementById('tab-' + tabName).classList.remove('hidden');																									
const activeBtn = document.getElementById('nav-' + tabName);																									
activeBtn.className = "flex flex-col items-center justify-center py-1 text-white text-[11px] font-bold rounded-lg bg-blue-800 shadow-inner";																									
																									
if (tabName === 'history') fetchHistory();																									
if (tabName === 'checkout') fetchCheckoutData();																									
}																									
																									
function fetchMenu() {																									
fetch(GAS_API_URL + "?action=getMenu")																									
.then(res => res.json())																									
.then(result => {																									
if (result && result.status === "success") {																									
menuData = result.data || [];																									
renderMenu();																									
} else {																									
alert("メニュー取得エラー: " + (result ? result.message : ""));																									
}																									
})																									
.catch(err => { console.error(err); });																									
}																									
																									
function renderMenu() {																									
const container = document.getElementById('menu-container');																									
container.innerHTML = '';																									
																									
const categories = {};																									
menuData.forEach(item => {																									
const cat = item.category || "その他";																									
if (!categories[cat]) categories[cat] = [];																									
categories[cat].push(item);																									
});																									
																									
Object.keys(categories).forEach(catName => {																									
const header = document.createElement('h3');																									
header.className = "text-sm font-bold text-blue-900 bg-blue-50 p-2 rounded-lg mt-2";																									
header.textContent = catName;																									
container.appendChild(header);																									
																									
categories[catName].forEach(item => {																									
const card = document.createElement('div');																									
card.className = "bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center";																									
card.innerHTML = `																									
<div>																									
<div class="font-bold text-gray-800 text-sm">${item.name}</div>																									
<div class="text-blue-700 font-bold text-sm mt-0.5">¥${Number(item.price).toLocaleString()}</div>																									
</div>																									
<div class="flex items-center space-x-2">																									
<button type="button" onclick="changeQuantity('${item.code}', -1)" class="w-8 h-8 rounded-full bg-gray-100 text-gray-700 font-bold flex items-center justify-center hover:bg-gray-200">-</button>																									
<span id="qty-${item.code}" class="font-bold w-4 text-center text-sm">0</span>																									
<button type="button" onclick="changeQuantity('${item.code}', 1)" class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center hover:bg-blue-700">+</button>																									
</div>																									
`;																									
container.appendChild(card);																									
});																									
});																									
}																									
																									
function changeQuantity(code, delta) {																									
const item = menuData.find(m => m.code === code);																									
if (!item) return;																									
																									
if (!cart[code]) cart[code] = { ...item, quantity: 0 };																									
cart[code].quantity += delta;																									
if (cart[code].quantity < 0) cart[code].quantity = 0;																									
																									
const qtyElem = document.getElementById(`qty-${code}`);																									
if (qtyElem) qtyElem.textContent = cart[code].quantity;																									
if (cart[code].quantity === 0) delete cart[code];																									
																									
updateCartBadge();																									
updateCartView();																									
}																									
																									
function updateCartBadge() {																									
let totalCount = 0;																									
Object.values(cart).forEach(i => totalCount += i.quantity);																									
const badge = document.getElementById('badge-cart');																									
if (totalCount > 0) {																									
badge.textContent = totalCount;																									
badge.classList.remove('hidden');																									
} else {																									
badge.classList.add('hidden');																									
}																									
}																									
																									
function updateCartView() {																									
const list = document.getElementById('cart-items-list');																									
list.innerHTML = '';																									
let totalPrice = 0;																									
let totalCount = 0;																									
																									
Object.values(cart).forEach(item => {																									
const sub = Number(item.price) * item.quantity;																									
totalPrice += sub;																									
totalCount += item.quantity;																									
																									
const row = document.createElement('div');																									
row.className = "flex justify-between items-center border-b pb-2 text-sm";																									
row.innerHTML = `																									
<div>																									
<div class="font-bold text-gray-800">${item.name}</div>																									
<div class="text-xs text-gray-500">¥${Number(item.price).toLocaleString()} × ${item.quantity}</div>																									
</div>																									
<div class="font-bold text-gray-800">¥${sub.toLocaleString()}</div>																									
`;																									
list.appendChild(row);																									
});																									
																									
if (totalCount === 0) {																									
list.innerHTML = '<p class="text-gray-400 text-center py-6 text-sm">注文かごに商品は入っていません。</p>';																									
}																									
																									
document.getElementById('cart-total').textContent = totalPrice.toLocaleString();																									
}																									
																									
function submitOrder() {																									
const itemsArray = Object.values(cart).filter(item => item.quantity > 0);																									
if (itemsArray.length === 0) return;																									
																									
const payload = {																									
action: "submitOrder",																									
payload: { tableNo: currentTableNo, items: itemsArray }																									
};																									
																									
fetch(GAS_API_URL, {																									
method: "POST",																									
headers: { "Content-Type": "text/plain;charset=utf-8" },																									
body: JSON.stringify(payload)																									
})																									
.then(res => res.json())																									
.then(result => {																									
if (result && result.status === "success") {																									
alert("注文を送信しました！");																									
cart = {};																									
document.querySelectorAll('[id^="qty-"]').forEach(el => el.textContent = '0');																									
updateCartBadge();																									
updateCartView();																									
switchTab('history');																									
} else {																									
alert("送信失敗: " + (result ? result.message : ""));																									
}																									
})																									
.catch(err => alert("通信エラーが発生しました。"));																									
}																									
																									
function fetchHistory() {																									
const list = document.getElementById('history-items-list');																									
list.innerHTML = '<p class="text-gray-400 text-center py-4 text-sm">履歴を読み込んでいます...</p>';																									
																									
fetch(GAS_API_URL + "?action=getOrderByTable&tableNo=" + encodeURIComponent(currentTableNo))																									
.then(res => res.json())																									
.then(res => {																									
if (res && res.status === "success" && res.items && res.items.length > 0) {																									
let html = '';																									
res.items.forEach(i => {																									
let badge = "bg-yellow-100 text-yellow-800";																									
if (i.cookStatus === "調理中") badge = "bg-blue-100 text-blue-800";																									
if (i.cookStatus === "提供済み") badge = "bg-green-100 text-green-800";																									
																									
html += `																									
<div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border text-sm">																									
<div>																									
<div class="font-bold text-gray-800">${i.name} × ${i.quantity}</div>																									
<div class="text-xs text-gray-500">¥${Number(i.price).toLocaleString()}</div>																									
</div>																									
<span class="text-xs px-2 py-1 rounded-full font-bold ${badge}">${i.cookStatus}</span>																									
</div>																									
`;																									
});																									
list.innerHTML = html;																									
} else {																									
list.innerHTML = '<p class="text-gray-400 text-center py-8 text-sm">注文履歴はありません。</p>';																									
}																									
})																									
.catch(err => list.innerHTML = '<p class="text-red-500 text-center py-4 text-sm">取得に失敗しました。</p>');																									
}																									
																									
function fetchCheckoutData() {																									
const list = document.getElementById('checkout-items-list');																									
list.innerHTML = '<p class="text-gray-400 text-center py-4 text-sm">計算中...</p>';																									
																									
fetch(GAS_API_URL + "?action=getOrderByTable&tableNo=" + encodeURIComponent(currentTableNo))																									
.then(res => res.json())																									
.then(res => {																									
if (res && res.status === "success" && res.items && res.items.length > 0) {																									
let html = '';																									
let total = 0;																									
res.items.forEach(i => {																									
const sub = Number(i.price) * i.quantity;																									
total += sub;																									
html += `																									
<div class="flex justify-between items-center border-b pb-2 text-sm">																									
<div>																									
<div class="font-bold text-gray-800">${i.name} × ${i.quantity}</div>																									
</div>																									
<div class="font-bold text-gray-800">¥${sub.toLocaleString()}</div>																									
</div>																									
`;																									
});																									
list.innerHTML = html;																									
document.getElementById('checkout-total').textContent = total.toLocaleString();																									
} else {																									
list.innerHTML = '<p class="text-gray-400 text-center py-8 text-sm">お会計対象の注文はありません。</p>';																									
document.getElementById('checkout-total').textContent = "0";																									
}																									
})																									
.catch(err => list.innerHTML = '<p class="text-red-500 text-center py-4 text-sm">取得に失敗しました。</p>');																									
}																									
																									
function callStaff() {																									
alert("従業員を呼び出しました。少々お待ちください。");																									
}																									
																									
function requestCheckout() {																									
const payload = {																									
action: "checkoutByTable",																									
payload: { tableNo: currentTableNo }																									
};																									
																									
fetch(GAS_API_URL, {																									
method: "POST",																									
headers: { "Content-Type": "text/plain;charset=utf-8" },																									
body: JSON.stringify(payload)																									
})																									
.then(res => res.json())																									
.then(res => {																									
if (res && res.status === "success") {																									
showReceipt(currentTableNo, res.data.totalPrice, res.data.items);																									
} else {																									
alert("お会計処理に失敗しました: " + (res ? res.message : ""));																									
}																									
})																									
.catch(err => alert("通信エラーが発生しました。"));																									
}																									
																									
function showReceipt(tableNo, totalPrice, itemsArray) {																									
document.getElementById('receipt-table-no').textContent = tableNo;																									
document.getElementById('receipt-total').textContent = "¥" + totalPrice.toLocaleString();																									
																									
const summary = document.getElementById('receipt-items-summary');																									
summary.innerHTML = '';																									
																									
const merged = {};																									
itemsArray.forEach(i => {																									
if (!merged[i.name]) merged[i.name] = { price: i.price, quantity: 0 };																									
merged[i.name].quantity += i.quantity;																									
});																									
																									
Object.keys(merged).forEach(name => {																									
const item = merged[name];																									
const div = document.createElement('div');																									
div.className = "flex justify-between text-xs";																									
div.innerHTML = `<span>${name} x${item.quantity}</span><span>¥${(item.price * item.quantity).toLocaleString()}</span>`;																									
summary.appendChild(div);																									
});																									
																									
document.getElementById('qrcode').innerHTML = "";																									
new QRCode(document.getElementById("qrcode"), { text: "CHECKOUT-" + tableNo + "-" + Date.now(), width: 100, height: 100 });																									
																									
document.getElementById('receipt-modal').classList.remove('hidden');																									
}																									
</script>																									
</body>																									
</html>
