id="t-btn-2"

<button

id="t-btn-3"																									
onclick="selectTempTable('3')"

4番テーブル

<div>																									
<p class="text-sm text-gray-500">																									
合計:																									
<span id="cart-count" class="font-bold">0</span>点																									
</p>																									
																									
<p class="text-lg font-bold text-indigo-600">																									
¥<span id="cart-total">0</span>																									
</p>																									
</div>																									
																									
<button																									
onclick="openCartModal()"																									
class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-bold">																									
カート確認

<div																									
id="cart-modal"																									
class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-end sm:items-center justify-center">																									
																									
<div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[90vh] flex flex-col">																									
																									
<div class="p-4 border-b flex justify-between">

onclick="closeCartModal()"																									
class="text-xl">																									
×

id="cart-items-list"																									
class="p-4 overflow-y-auto flex-grow space-y-3">																									
</div>																									
																									
<div class="p-4 border-t bg-gray-50">																									
																									
<div class="flex justify-between text-lg font-bold mb-4">																									
<span>合計</span>																									
																									
<span class="text-indigo-600">																									
¥<span id="modal-total">0</span>																									
</span>																									
</div>																									
																									
<button																									
id="submit-btn"																									
onclick="submitOrder()"																									
class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold">																									
注文を確定する																									
</button>

</div>

<!-- 注文状況 -->

class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">																									
																									
<div class="bg-white w-full max-w-md rounded-2xl p-6 max-h-[90vh] overflow-y-auto">																									
																									
<div class="flex justify-between border-b pb-3">																									
<h2 class="font-bold">注文状況・お会計</h2>																									
																									
<button																									
onclick="closeStatusModal()"																									
class="text-xl">																									
×

</div>																									
																									
<div																									
id="status-content"																									
class="space-y-3 text-sm py-4">																									
</div>

<button																									
onclick="requestCheckout()"																									
class="w-full bg-green-600 text-white py-3 rounded-xl font-bold">																									
お会計する

</div>																									
</div>																									
																									
																									
<!-- 領収書 -->																									
<div																									
id="receipt-modal"																									
class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">																									
																									
<div class="bg-white w-full max-w-md rounded-2xl p-6 text-center space-y-4 max-h-[90vh] overflow-y-auto">																									
																									
<div class="text-green-600 text-5xl font-bold">																									
✓																									
</div>																									
																									
<h2 class="text-xl font-bold">																									
お会計完了																									
</h2>																									
																									
<p class="text-sm">																									
注文ID:																									
<span id="receipt-order-id" class="font-bold"></span>																									
</p>																									
																									
<div class="border border-dashed p-4 rounded-xl text-left text-sm">																									
																									
<div class="text-center font-bold border-b pb-2 mb-2">																									
デジタル領収書																									
</div>																									
																									
<div class="text-xs text-gray-500 mb-2">																									
発行日時:																									
<span id="receipt-date"></span>																									
</div>																									
																									
<div																									
id="receipt-items-summary"																									
class="space-y-1 border-b pb-2">																									
</div>																									
																									
<div class="flex justify-between font-bold text-lg pt-2">																									
<span>合計</span>																									
<span id="receipt-total">¥0</span>																									
</div>																									
																									
</div>																									
																									
<div class="flex flex-col items-center">																									
<div id="qrcode"></div>																									
																									
<p class="text-xs text-gray-400 mt-2">																									
お会計用QRコード																									
</p>																									
</div>																									
																									
<button																									
onclick="location.reload()"																									
class="w-full bg-gray-200 py-3 rounded-xl font-bold">																									
閉じる																									
</button>																									
																									
</div>																									
</div>																									
																									
																									
<script>																									
																									
/* ================================																									
GAS URL																									
#ERROR!																									
																									
const GAS_API_URL =																									
https://script.google.com/macros/s/AKfycbz1UPfYqM3ww8ZImbqpOCM73qXw5hrrzdJG75chYd5P8V-9Z6mQdrbDo0GyxEtq4UJbNw/exec;																									
																									
																									
/* ================================																									
データ																									
#ERROR!																									
																									
let menuData = [];																									
let cart = {};																									
																									
let currentTableNo =																									
localStorage.getItem("order_table_no") || "";																									
																									
let currentOrderId =																									
localStorage.getItem("order_id") || "";																									
																									
let tempSelectedTable = "";																									
																									
																									
/* ================================																									
起動																									
#ERROR!																									
																									
window.onload = function() {																									
																									
if (currentTableNo) {																									
																									
document																									
.getElementById("table-modal")																									
.classList.add("hidden");																									
																									
document																									
.getElementById("display-table")																									
.textContent = currentTableNo + "番";																									
																									
fetchMenu();																									
																									
} else {																									
																									
document																									
.getElementById("table-modal")																									
.classList.remove("hidden");																									
}																									
};																									
																									
																									
/* ================================																									
テーブル選択																									
#ERROR!																									
																									
function selectTempTable(tableNo) {																									
																									
tempSelectedTable = String(tableNo);																									
																									
document																									
.querySelectorAll(".table-select-btn")																									
.forEach(btn => {																									
																									
btn.className =																									
table-select-btn w-full bg-gray-50 border border-gray-200 font-bold py-3 rounded-xl;																									
});																									
																									
const selected =																									
document.getElementById("t-btn-" + tableNo);																									
																									
if (selected) {																									
																									
selected.className =																									
table-select-btn w-full bg-indigo-600 text-white border border-indigo-600 font-bold py-3 rounded-xl;																									
}																									
}																									
																									
																									
function confirmTable() {																									
																									
if (!tempSelectedTable) {																									
																									
alert("テーブル番号を選択してください。");																									
return;																									
}																									
																									
currentTableNo = tempSelectedTable;																									
																									
localStorage.setItem(																									
order_table_no,																									
currentTableNo																									
);																									
																									
document																									
.getElementById("display-table")																									
.textContent = currentTableNo + "番";																									
																									
document																									
.getElementById("table-modal")																									
.classList.add("hidden");																									
																									
fetchMenu();																									
}																									
																									
																									
/* ================================																									
通信																									
#ERROR!																									
																									
async function fetchWithTimeout(url, options = {}, timeout = 10000) {																									
																									
const controller = new AbortController();																									
																									
const timer = setTimeout(																									
() => controller.abort(),																									
timeout																									
);																									
																									
try {																									
																									
const response = await fetch(url, {																									
...options,																									
signal: controller.signal																									
});																									
																									
clearTimeout(timer);																									
																									
return response;																									
																									
} catch (error) {																									
																									
clearTimeout(timer);																									
throw error;																									
}																									
}																									
																									
																									
/* ================================																									
メニュー取得																									
#ERROR!																									
																									
async function fetchMenu() {																									
																									
const loading =																									
document.getElementById("loading");																									
																									
const menu =																									
document.getElementById("menu-container");																									
																									
const errorArea =																									
document.getElementById("error-area");																									
																									
loading.classList.remove("hidden");																									
menu.classList.add("hidden");																									
errorArea.classList.add("hidden");																									
																									
try {																									
																									
const response = await fetchWithTimeout(																									
GAS_API_URL +																									
?action=getMenu&t= +																									
Date.now()																									
);																									
																									
const result = await response.json();																									
																									
if (																									
result.status !== "success" ||																									
!Array.isArray(result.data)																									
) {																									
																									
throw new Error(																									
result.message || "メニュー取得失敗"																									
);																									
}																									
																									
menuData = result.data;																									
																									
loading.classList.add("hidden");																									
																									
renderMenu();																									
																									
} catch (error) {																									
																									
console.error(error);																									
																									
loading.classList.add("hidden");																									
																									
document																									
.getElementById("error-message")																									
.textContent =																									
メニューを取得できませんでした。通信またはGAS設定を確認してください。;																									
																									
errorArea.classList.remove("hidden");																									
}																									
}																									
																									
																									
/* ================================																									
メニュー表示																									
#ERROR!																									
																									
function renderMenu() {																									
																									
const container =																									
document.getElementById("menu-container");																									
																									
container.innerHTML = "";																									
																									
container.classList.remove("hidden");																									
																									
if (menuData.length === 0) {																									
																									
container.innerHTML =																									
<p class="text-gray-500 text-center py-6">メニューが登録されていません。</p>';																									
																									
return;																									
}																									
																									
menuData.forEach(item => {																									
																									
const card =																									
document.createElement("div");																									
																									
card.className =																									
bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center;																									
																									
card.innerHTML = `																									
<div>																									
<h3 class="font-bold">																									
${item.name}																									
</h3>																									
																									
<p class="text-indigo-600 font-bold">																									
¥${Number(item.price).toLocaleString()}																									
</p>																									
																									
<p class="text-xs text-gray-400">																									
${item.category || ""}																									
</p>																									
</div>																									
																									
<div class="flex items-center space-x-3">																									
																									
<button																									
onclick="changeQuantity('${item.code}', -1)"																									
class="w-8 h-8 bg-gray-100 rounded-full font-bold">																									
−																									
</button>																									
																									
<span																									
id="qty-${item.code}"																									
class="font-bold">																									
0																									
</span>																									
																									
<button																									
onclick="changeQuantity('${item.code}', 1)"																									
class="w-8 h-8 bg-indigo-600 text-white rounded-full font-bold">																									
＋																									
</button>																									
																									
</div>																									
`;																									
																									
container.appendChild(card);																									
});																									
}																									
																									
																									
/* ================================																									
数量変更																									
#ERROR!																									
																									
function changeQuantity(code, delta) {																									
																									
const item =																									
menuData.find(																									
m => String(m.code) === String(code)																									
);																									
																									
if (!item) return;																									
																									
if (!cart[code]) {																									
																									
cart[code] = {																									
...item,																									
quantity: 0																									
};																									
}																									
																									
cart[code].quantity += delta;																									
																									
if (cart[code].quantity < 0) {																									
cart[code].quantity = 0;																									
}																									
																									
document																									
.getElementById("qty-" + code)																									
.textContent =																									
cart[code].quantity;																									
																									
if (cart[code].quantity === 0) {																									
delete cart[code];																									
}																									
																									
updateCartSummary();																									
}																									
																									
																									
/* ================================																									
カート																									
#ERROR!																									
																									
function updateCartSummary() {																									
																									
let count = 0;																									
let total = 0;																									
																									
Object.values(cart).forEach(item => {																									
																									
count += item.quantity;																									
																									
total +=																									
Number(item.price) *																									
item.quantity;																									
});																									
																									
document																									
.getElementById("cart-count")																									
.textContent = count;																									
																									
document																									
.getElementById("cart-total")																									
.textContent =																									
total.toLocaleString();																									
																									
const bar =																									
document.getElementById("cart-bar");																									
																									
if (count > 0) {																									
bar.classList.remove("hidden");																									
} else {																									
bar.classList.add("hidden");																									
}																									
}																									
																									
																									
function openCartModal() {																									
																									
const list =																									
document.getElementById("cart-items-list");																									
																									
list.innerHTML = "";																									
																									
let total = 0;																									
																									
Object.values(cart).forEach(item => {																									
																									
const subtotal =																									
Number(item.price) *																									
item.quantity;																									
																									
total += subtotal;																									
																									
const row =																									
document.createElement("div");																									
																									
row.className =																									
flex justify-between border-b pb-2;																									
																									
row.innerHTML = `																									
<div>																									
<div class="font-bold">																									
${item.name}																									
</div>																									
																									
<div class="text-xs text-gray-500">																									
¥${Number(item.price).toLocaleString()}																									
× ${item.quantity}																									
</div>																									
</div>																									
																									
<div class="font-bold">																									
¥${subtotal.toLocaleString()}																									
</div>																									
`;																									
																									
list.appendChild(row);																									
});																									
																									
document																									
.getElementById("modal-total")																									
.textContent =																									
total.toLocaleString();																									
																									
document																									
.getElementById("cart-modal")																									
.classList.remove("hidden");																									
}																									
																									
																									
function closeCartModal() {																									
																									
document																									
.getElementById("cart-modal")																									
.classList.add("hidden");																									
}																									
																									
																									
/* ================================																									
注文送信																									
#ERROR!																									
																									
async function submitOrder() {																									
																									
const items =																									
Object.values(cart)																									
.filter(item => item.quantity > 0);																									
																									
if (items.length === 0) return;																									
																									
const button =																									
document.getElementById("submit-btn");																									
																									
button.disabled = true;																									
button.textContent = "送信中...";																									
																									
try {																									
																									
const response =																									
await fetchWithTimeout(																									
GAS_API_URL,																									
{																									
method: "POST",																									
																									
headers: {																									
Content-Type:																									
text/plain;charset=utf-8																									
},																									
																									
body: JSON.stringify({																									
action: "submitOrder",																									
																									
payload: {																									
tableNo: currentTableNo,																									
items: items																									
}																									
})																									
},																									
15000																									
);																									
																									
const result =																									
await response.json();																									
																									
if (result.status !== "success") {																									
																									
throw new Error(																									
result.message || "注文失敗"																									
);																									
}																									
																									
currentOrderId =																									
result.data.orderId;																									
																									
localStorage.setItem(																									
order_id,																									
currentOrderId																									
);																									
																									
cart = {};																									
																									
closeCartModal();																									
updateCartSummary();																									
																									
alert(																									
注文が完了しました。\nキッチンへ送信しました。																									
);																									
																									
location.reload();																									
																									
} catch (error) {																									
																									
console.error(error);																									
																									
alert(																									
注文を送信できませんでした。\n通信状態を確認してください。																									
);																									
																									
} finally {																									
																									
button.disabled = false;																									
button.textContent =																									
注文を確定する;																									
}																									
}

document.getElementById("status-content");

);

`<p class="text-xs text-gray-500">

/* ================================																									
会計																									
#ERROR!																									
																									
async function requestCheckout() {																									
																									
if (!currentOrderId) return;																									
																									
try {																									
																									
const response =																									
await fetchWithTimeout(																									
GAS_API_URL,																									
{																									
method: "POST",																									
																									
headers: {																									
Content-Type:																									
text/plain;charset=utf-8																									
},																									
																									
body: JSON.stringify({																									
action: "checkout",

orderId: currentOrderId																									
}																									
})																									
},																									
15000																									
);

);																									
}

result.data.orderId,																									
result.data.totalPrice,																									
result.data.items																									
);																									
																									
} catch (error) {																									
																									
console.error(error);																									
																									
alert(																									
会計処理に失敗しました。																									
);																									
}																									
}
