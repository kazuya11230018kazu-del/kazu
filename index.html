<!DOCTYPE html>																									
<html lang="ja">																									
<head>																									
<meta charset="UTF-8">																									
<meta name="viewport" content="width=device-width, initial-scale=1.0">																									
<title>モバイルオーダーシステム</title>																									
<script src="https://cdn.tailwindcss.com"></script>																									
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>																									
</head>																									
<body class="bg-blue-900 text-gray-800 pb-20 select-none">																									
																									
<!-- ウェルカム画面 -->																									
<div id="screen-welcome" class="fixed inset-0 bg-blue-900 z-50 flex flex-col justify-between items-center p-6 text-white">																									
<div class="w-full text-center pt-8"><p class="text-xl font-bold tracking-widest text-blue-100">いらっしゃいませ</p></div>																									
<div class="bg-white w-full max-w-sm rounded-3xl p-8 text-center shadow-2xl space-y-6 my-auto">																									
<div class="border-2 border-blue-600 rounded-full py-2 px-4 inline-block mx-auto bg-blue-50">																									
<span class="text-blue-800 font-bold text-sm">セルフモバイルオーダー</span>																									
</div>																									
<div class="text-3xl font-extrabold text-blue-900 tracking-wider">レストラン オーダー</div>																									
<button onclick="goToMain()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl text-xl shadow-lg transition">																									
注文をはじめる																									
</button>																									
</div>																									
<div class="text-xs text-blue-300 pb-4">&copy; Mobile Order System.</div>																									
</div>																									
																									
<!-- メイン画面 -->																									
<div id="screen-main" class="max-w-md mx-auto min-h-screen bg-white hidden flex flex-col">																									
<header class="bg-blue-900 text-white p-3 sticky top-0 z-20 shadow flex justify-between items-center">																									
<span class="text-xs font-bold text-blue-200">テーブル: <span id="display-table">1</span>番</span>																									
<span class="text-xs bg-blue-800 px-2 py-1 rounded text-blue-100 font-bold">接続中</span>																									
</header>																									
																									
<div class="flex-grow p-4 pb-28">																									
<!-- メニュータブ -->																									
<div id="tab-menu" class="space-y-4">																									
<div class="text-center py-2 bg-blue-50 rounded-lg text-blue-900 text-xs font-bold border border-blue-200">																									
メニューを選んで数量を指定してください																									
</div>																									
<div id="menu-container" class="space-y-3">																									
<p class="text-center text-gray-400 py-6 text-sm">メニューを読み込んでいます...</p>																									
</div>																									
</div>																									
																									
<!-- カートタブ -->																									
<div id="tab-cart" class="space-y-4 hidden">																									
<h2 class="text-base font-bold text-gray-700 border-b pb-2">注文かごの中身</h2>																									
<div id="cart-items-list" class="space-y-3 max-h-[60vh] overflow-y-auto"></div>																									
<div class="border-t pt-3">																									
<div class="flex justify-between text-lg font-bold mb-4">																									
<span>合計金額（税込）</span>																									
<span class="text-blue-700">¥<span id="cart-total">0</span></span>																									
</div>																									
<div class="flex space-x-2">																									
<button onclick="switchTab('menu')" class="w-1/2 bg-gray-300 text-gray-700 py-3 rounded-xl font-bold">追加</button>																									
<button onclick="submitOrder()" class="w-1/2 bg-blue-600 text-white py-3 rounded-xl font-bold shadow">注文する</button>																									
</div>																									
</div>																									
</div>																									
																									
<!-- 履歴タブ -->																									
<div id="tab-history" class="space-y-4 hidden">																									
<h2 class="text-base font-bold text-gray-700 border-b pb-2">注文履歴・状況</h2>																									
<div id="history-items-list" class="space-y-3 max-h-[65vh] overflow-y-auto">																									
<p class="text-gray-400 text-center py-8 text-sm">読み込み中...</p>																									
</div>																									
</div>																									
																									
<!-- 店員呼出タブ -->																									
<div id="tab-call" class="space-y-6 text-center py-10 hidden">																									
<div class="text-5xl">🔔</div>																									
<h2 class="text-xl font-bold text-gray-800">従業員の呼び出し</h2>																									
<button onclick="alert('店員を呼びました')" class="mx-auto bg-amber-600 text-white px-8 py-4 rounded-2xl font-bold text-lg shadow">																									
店員を呼び出す																									
</button>																									
</div>																									
																									
<!-- 会計タブ -->																									
<div id="tab-checkout" class="space-y-4 hidden">																									
<h2 class="text-base font-bold text-gray-700 border-b pb-2">お会計の確認</h2>																									
<div id="checkout-items-list" class="space-y-3 max-h-[55vh] overflow-y-auto">																									
<p class="text-gray-400 text-center py-8 text-sm">読み込み中...</p>																									
</div>																									
<div class="border-t pt-3">																									
<div class="flex justify-between text-lg font-bold mb-4">																									
<span>お支払い総額</span>																									
<span class="text-blue-700">¥<span id="checkout-total">0</span></span>																									
</div>																									
<button onclick="requestCheckout()" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold shadow">																									
お支払いへ進む																									
</button>																									
</div>																									
</div>																									
</div>																									
</div>																									
																									
<!-- 下部固定ナビバー -->																									
<nav id="footer-nav" class="fixed bottom-0 left-0 right-0 bg-blue-900 border-t border-blue-800 py-2 px-1 grid grid-cols-5 gap-1 shadow-2xl z-30 max-w-md mx-auto hidden">																									
<button onclick="switchTab('menu')" id="nav-menu" class="flex flex-col items-center justify-center py-1 text-white text-[11px] font-bold rounded-lg bg-blue-800">																									
<span>➕</span><span>注文追加</span>																									
</button>																									
<button onclick="switchTab('cart')" id="nav-cart" class="flex flex-col items-center justify-center py-1 text-blue-200 text-[11px] font-bold rounded-lg relative">																									
<span>🛒</span><span>注文かご</span>																									
<span id="badge-cart" class="absolute top-1 right-3 bg-red-600 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center hidden font-bold">0</span>																									
</button>																									
<button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center justify-center py-1 text-blue-200 text-[11px] font-bold rounded-lg">																									
<span>📋</span><span>注文履歴</span>																									
</button>																									
<button onclick="switchTab('call')" id="nav-call" class="flex flex-col items-center justify-center py-1 text-blue-200 text-[11px] font-bold rounded-lg">																									
<span>🔔</span><span>店員呼出</span>																									
</button>																									
<button onclick="switchTab('checkout')" id="nav-checkout" class="flex flex-col items-center justify-center py-1 text-blue-200 text-[11px] font-bold rounded-lg">																									
<span>💰</span><span>会計する</span>																									
</button>																									
</nav>																									
																									
<!-- 領収書モーダル -->																									
<div id="receipt-modal" class="fixed inset-0 bg-black bg-opacity-70 z-50 hidden flex items-center justify-center p-4">																									
<div class="bg-white w-full max-w-md rounded-2xl p-6 text-center space-y-4 shadow-2xl">																									
<div class="text-blue-600 text-5xl font-bold">✓</div>																									
<h2 class="text-xl font-bold text-gray-800">お会計が完了しました</h2>																									
<div class="border border-dashed border-gray-300 p-4 rounded-xl text-left text-sm space-y-2 bg-gray-50">																									
<div id="receipt-items-summary" class="py-2 space-y-1 border-b"></div>																									
<div class="flex justify-between font-bold text-base pt-1"><span>合計</span><span id="receipt-total">¥0</span></div>																									
</div>																									
<div id="qrcode" class="p-2 bg-white border rounded inline-block"></div>																									
<button onclick="location.reload()" class="w-full bg-gray-200 text-gray-700 py-3 rounded-xl font-bold">最初に戻る</button>																									
</div>																									
</div>																									
																									
<script>																									
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx1KxRv4QBFyEgXzlOmbp9VswB7pI0fRkX3hSX21Sxj0lmxURYX0PQNIteHUJNQqlAmYQ/exec";																									
																									
let menuData = [];																									
let cart = {};																									
let currentTableNo = "1";																									
																									
function goToMain() {																									
document.getElementById('screen-welcome').classList.add('hidden');																									
document.getElementById('screen-main').classList.remove('hidden');																									
document.getElementById('footer-nav').classList.remove('hidden');																									
fetchMenu();																									
}																									
																									
function switchTab(tabName) {																									
['menu', 'cart', 'history', 'call', 'checkout'].forEach(t => {																									
document.getElementById('tab-' + t).classList.add('hidden');																									
document.getElementById('nav-' + t).className = "flex flex-col items-center justify-center py-1 text-blue-200 text-[11px] font-bold rounded-lg";																									
});																									
document.getElementById('tab-' + tabName).classList.remove('hidden');																									
document.getElementById('nav-' + tabName).className = "flex flex-col items-center justify-center py-1 text-white text-[11px] font-bold rounded-lg bg-blue-800";																									
																									
if (tabName === 'history') fetchHistory();																									
if (tabName === 'checkout') fetchCheckoutData();																									
}																									
																									
function fetchMenu() {																									
fetch(GAS_API_URL + "?action=getMenu")																									
.then(res => res.json())																									
.then(result => {																									
if (result && result.status === "success") {																									
menuData = result.data || [];																									
renderMenu();																									
} else {																									
alert("メニュー取得失敗: " + (result.message || ""));																									
}																									
})																									
.catch(err => {																									
console.error(err);																									
alert("メニューの取得に失敗しました。");																									
});																									
}																									
																									
function renderMenu() {																									
const container = document.getElementById('menu-container');																									
container.innerHTML = '';																									
if (menuData.length === 0) {																									
container.innerHTML = '<p class="text-center text-gray-400 py-10">メニューがありません</p>';																									
return;																									
}																									
																									
const categories = {};																									
menuData.forEach(item => {																									
const cat = item.category || "その他";																									
if (!categories[cat]) categories[cat] = [];																									
categories[cat].push(item);																									
});																									
																									
Object.keys(categories).forEach(catName => {																									
const header = document.createElement('h3');																									
header.className = "text-sm font-bold text-blue-900 bg-blue-50 p-2 rounded-lg mt-2";																									
header.textContent = catName;																									
container.appendChild(header);																									
																									
categories[catName].forEach(item => {																									
const card = document.createElement('div');																									
card.className = "bg-white p-3 rounded-xl shadow-sm border flex justify-between items-center";																									
card.innerHTML = `																									
<div>																									
<div class="font-bold text-gray-800 text-sm">${item.name}</div>																									
<div class="text-blue-700 font-bold text-sm">¥${item.price.toLocaleString()}</div>																									
</div>																									
<div class="flex items-center space-x-2">																									
<button onclick="changeQty('${item.code}', -1)" class="w-8 h-8 rounded-full bg-gray-100 font-bold">-</button>																									
<span id="qty-${item.code}" class="font-bold w-4 text-center text-sm">0</span>																									
<button onclick="changeQty('${item.code}', 1)" class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold">+</button>																									
</div>																									
`;																									
container.appendChild(card);																									
});																									
});																									
}																									
																									
function changeQty(code, delta) {																									
const item = menuData.find(m => m.code === code);																									
if (!item) return;																									
if (!cart[code]) cart[code] = { ...item, quantity: 0 };																									
cart[code].quantity += delta;																									
if (cart[code].quantity < 0) cart[code].quantity = 0;																									
if (cart[code].quantity === 0) delete cart[code];																									
																									
const qtyEl = document.getElementById(`qty-${code}`);																									
if (qtyEl) qtyEl.textContent = cart[code] ? cart[code].quantity : 0;																									
																									
updateCartBadge();																									
updateCartView();																									
}																									
																									
function updateCartBadge() {																									
let count = 0;																									
Object.values(cart).forEach(i => count += i.quantity);																									
const badge = document.getElementById('badge-cart');																									
if (count > 0) {																									
badge.textContent = count;																									
badge.classList.remove('hidden');																									
} else {																									
badge.classList.add('hidden');																									
}																									
}																									
																									
function updateCartView() {																									
const list = document.getElementById('cart-items-list');																									
list.innerHTML = '';																									
let total = 0, count = 0;																									
																									
Object.values(cart).forEach(i => {																									
const sub = i.price * i.quantity;																									
total += sub; count += i.quantity;																									
const row = document.createElement('div');																									
row.className = "flex justify-between items-center border-b pb-2 text-sm";																									
row.innerHTML = `<div><div class="font-bold">${i.name}</div><div class="text-xs text-gray-500">¥${i.price} × ${i.quantity}</div></div><div class="font-bold">¥${sub.toLocaleString()}</div>`;																									
list.appendChild(row);																									
});																									
																									
if (count === 0) list.innerHTML = '<p class="text-gray-400 text-center py-6 text-sm">注文かごは空です</p>';																									
document.getElementById('cart-total').textContent = total.toLocaleString();																									
}																									
																									
function submitOrder() {																									
const items = Object.values(cart).filter(i => i.quantity > 0);																									
if (items.length === 0) return;																									
																									
fetch(GAS_API_URL, {																									
method: "POST",																									
headers: { "Content-Type": "text/plain;charset=utf-8" },																									
body: JSON.stringify({ action: "submitOrder", payload: { tableNo: currentTableNo, items: items } })																									
})																									
.then(res => res.json())																									
.then(result => {																									
if (result && result.status === "success") {																									
alert("注文を送信しました！");																									
cart = {};																									
document.querySelectorAll('[id^="qty-"]').forEach(el => el.textContent = '0');																									
updateCartBadge();																									
updateCartView();																									
switchTab('history');																									
} else {																									
alert("送信失敗: " + (result.message || ""));																									
}																									
})																									
.catch(err => alert("通信エラーが発生しました"));																									
}																									
																									
function fetchHistory() {																									
const list = document.getElementById('history-items-list');																									
list.innerHTML = '<p class="text-gray-400 text-center py-4 text-sm">読み込み中...</p>';																									
																									
fetch(GAS_API_URL + "?action=getOrderByTable&tableNo=" + encodeURIComponent(currentTableNo))																									
.then(res => res.json())																									
.then(res => {																									
if (res && res.status === "success" && res.items && res.items.length > 0) {																									
let html = '';																									
res.items.forEach(i => {																									
html += `<div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border text-sm"><div><div class="font-bold">${i.name} × ${i.quantity}</div></div><span class="text-xs px-2 py-1 rounded-full font-bold bg-yellow-100 text-yellow-800">${i.cookStatus}</span></div>`;																									
});																									
list.innerHTML = html;																									
} else {																									
list.innerHTML = '<p class="text-gray-400 text-center py-8 text-sm">注文履歴はありません</p>';																									
}																									
})																									
.catch(err => list.innerHTML = '<p class="text-red-500 text-center py-4 text-sm">取得失敗</p>');																									
}																									
																									
function fetchCheckoutData() {																									
const list = document.getElementById('checkout-items-list');																									
list.innerHTML = '<p class="text-gray-400 text-center py-4 text-sm">計算中...</p>';																									
																									
fetch(GAS_API_URL + "?action=getOrderByTable&tableNo=" + encodeURIComponent(currentTableNo))																									
.then(res => res.json())																									
.then(res => {																									
if (res && res.status === "success" && res.items && res.items.length > 0) {																									
let html = '', total = 0;																									
res.items.forEach(i => {																									
const sub = i.price * i.quantity;																									
total += sub;																									
html += `<div class="flex justify-between items-center border-b pb-2 text-sm"><div><div class="font-bold">${i.name} × ${i.quantity}</div></div><div class="font-bold">¥${sub.toLocaleString()}</div></div>`;																									
});																									
list.innerHTML = html;																									
document.getElementById('checkout-total').textContent = total.toLocaleString();																									
} else {																									
list.innerHTML = '<p class="text-gray-400 text-center py-8 text-sm">お会計対象の注文はありません</p>';																									
document.getElementById('checkout-total').textContent = "0";																									
}																									
})																									
.catch(err => list.innerHTML = '<p class="text-red-500 text-center py-4 text-sm">取得失敗</p>');																									
}																									
																									
function requestCheckout() {																									
fetch(GAS_API_URL, {																									
method: "POST",																									
headers: { "Content-Type": "text/plain;charset=utf-8" },																									
body: JSON.stringify({ action: "checkoutByTable", payload: { tableNo: currentTableNo } })																									
})																									
.then(res => res.json())																									
.then(res => {																									
if (res && res.status === "success") {																									
showReceipt(res.data.totalPrice, res.data.items);																									
} else {																									
alert("お会計処理に失敗しました: " + (res.message || ""));																									
}																									
})																									
.catch(err => alert("通信エラーが発生しました"));																									
}																									
																									
function showReceipt(totalPrice, itemsArray) {																									
document.getElementById('receipt-total').textContent = "¥" + totalPrice.toLocaleString();																									
const summary = document.getElementById('receipt-items-summary');																									
summary.innerHTML = '';																									
itemsArray.forEach(i => {																									
const div = document.createElement('div');																									
div.className = "flex justify-between text-xs";																									
div.innerHTML = `<span>${i.name} x${i.quantity}</span><span>¥${(i.price * i.quantity).toLocaleString()}</span>`;																									
summary.appendChild(div);																									
});																									
document.getElementById('qrcode').innerHTML = "";																									
new QRCode(document.getElementById("qrcode"), { text: "CHECKOUT-" + currentTableNo + "-" + Date.now(), width: 100, height: 100 });																									
document.getElementById('receipt-modal').classList.remove('hidden');																									
}																									
</script>																									
</body>																									
</html>
